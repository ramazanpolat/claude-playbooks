# This repo's run policy — which suites run when. Decided once, at
# adaptation (AGENTS.md, decision 5); read only by gentar/plan.py, which
# the kit's workflow asks what to run. Unknown keys are refused, so a typo
# cannot silently mean a default.

[phase1]
# Every pull request and every push to the default branch.
checks = true          # bench-free, GitHub-hosted: dry-run, lint, kit drift
bench = "off"          # this repository has no bench runner ([arena] below):
                       # mirror mode requires "off" and an empty floor.
floor = []             # was cli-head-build, docs-honesty, playbook-lifecycle
                       # on every push to main. In mirror mode they run in
                       # the mirror's phase 2, with every other suite: daily
                       # on main's head, or on a `gentar/mirror.sh dispatch`.
setup = { go = "1.26" }     # toolchains dryrun's prepare() needs on the
                            # GitHub-hosted runner (go, node, python);
                            # anything else: gentar/phase1-setup.sh
# Go 1.26, the version everything builds with since v3.25.0: go.mod's
# `go 1.26.0`, CI's test legs and the bench's golang:1.26 build. (1.21, the
# floor before, needed a newer Go on macOS: Go 1.21's linker emits binaries
# current macOS will not load, "dyld: missing LC_UUID load command", #59.)
os = ["ubuntu-latest", "macos-latest"]   # where the checks run. macOS = the
                            # dry-run on macOS userland (bash 3.2, BSD tools):
                            # real bugs (bash 3.2 `source <(...)`), not a bench.

[phase2]
# The full regression: every suite this environment can run.
on = ["dispatch", "arena", "rc"]   # moot in mirror mode: this repository's
                       # workflow runs no bench on any event. Phase 2 runs in
                       # the mirror: `gentar/mirror.sh dispatch <sha>`, or its
                       # daily schedule on main's head.
release_gate = true    # gentar/release-gate.sh refuses a v* release whose
                       # commit has no success `arena/phase2` commit status
max_age_days = 2       # that phase 2 must also be this recent: a pass older
                       # than two days does not release (the bench image,
                       # agent CLI or provider may have moved since). The
                       # pilot's rule of 2026-09-29: a green full phase 2 on
                       # the exact tag commit replaces the 7 green nights.
evidence = "status"    # what proves phase 2 to the release gate: the commit
                       # status `arena/phase2`, linking a run of the mirror
                       # below (mirror.sh posts it). Mirror mode requires it.

[arena]
bench = "mirror"       # cpb is PUBLIC: no self-hosted runner is registered
                       # here, so a fork's own workflow cannot reach the bench
                       # key (D5, 2026-10-08). The PRIVATE mirror below pulls
                       # this repository and runs phase 2 on its own runner.
mirror = "ramazanpolat/claude-playbooks-arena"

[check]
docs = true            # the docs standard, checked by --check (missing, not
                       # quality): README.md short (what / why / how),
                       # docs/tutorials/ + docs/guides/, examples/*/README.md,
                       # AGENTS.md, relative links resolve.
# allow_drift = []     # kit files you have deliberately changed; --check
                       # then notes the difference instead of failing
