# This repo's run policy — which suites run when. Decided once, at
# adaptation (AGENTS.md, decision 5); read only by gentar/plan.py, which
# the kit's workflow asks what to run. Unknown keys are refused, so a typo
# cannot silently mean a default.

[phase1]
# Every pull request and every push to the default branch.
checks = true          # bench-free, GitHub-hosted: dry-run, lint, kit drift
bench = "off"          # "off": PRs never reach the self-hosted runner.
                       # "declared": a same-repo PR also runs, on the bench,
                       # the floor plus the suites its body names on a
                       # `gentar: a b` line. On a PUBLIC repo that puts PR
                       # code on your runner — the pilot's call, not a default.
floor = ["cli-head-build", "docs-honesty", "playbook-lifecycle"]             # suites that run on the bench for every push to the
                       # default branch (and every declared PR): the cheap,
                       # deterministic guard rails
setup = { go = "1.21" }     # toolchains dryrun's prepare() needs on the
                            # GitHub-hosted runner (go, node, python);
                            # anything else: gentar/phase1-setup.sh

[phase2]
# The full regression: every suite this environment can run.
on = ["dispatch", "arena", "rc"]   # manual dispatch · the `arena` tag · v*-rc* tags
release_gate = true    # gentar/release-gate.sh refuses a v* release whose
                       # commit has no green `arena / phase2` job
max_age_days = 0       # >0: that phase 2 must also be this recent

# [check]
# allow_drift = []     # kit files you have deliberately changed; --check
                       # then notes the difference instead of failing
