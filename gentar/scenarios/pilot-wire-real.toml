# claude-playbooks own-arena suite 15: `create` and `install` against the
# REAL `pilot` (pilot-profile), not the fake one the unit tests put on PATH.
#
# Since #50 (v3.15.0) both commands run `pilot wire <dest>` when `pilot` is on
# PATH and discard the result. Until this suite, that path had only been
# exercised with a stub, and the arena's other suites hide `pilot` on purpose
# (gentar/hooks.py) -- so "creating a playbook wires your profile" had never
# been proven. It was in fact false through pilot-profile v0.2.0: `wire` found
# the template's imports already present and had nothing to link into, so a
# created playbook came out byte-identical with or without `pilot`.
#
# The observable is pilot-profile's contract guarantee 8, and nothing else:
# after `wire` exits 0 for an install with a CLAUDE.md, <install>/skills/profile
# is a symlink to <pilot-profile checkout>/skill, which holds SKILL.md. Not the
# imports (create writes those itself) and not wire's status text (not
# contract). Everything is resolved from `command -v pilot`, so the suite is
# the same on the bench (/usr/local/bin -> /opt/pilot-profile) and wherever a
# dry-run stages its own copy.
#
# The bench is OURS: pilot-profile is private and this repo is public, so the
# pinned release is baked into cpb-pilot-bench-v1 by
# gentar/bench-template/build-pilot.sh, from a `git archive` of the SHA in
# gentar/bench-template/PILOT_PROFILE. The first assertion checks the template
# against that pin, so a stale template fails loudly.
#
# Mid-sequence state is proven inside chained commands -- gentar runs
# verify.files (post-steps only) before verify.commands.

[scenario]
name = "pilot-wire-real"
subject = "claude-playbooks"
agent = "shell"
template = "cpb-pilot-bench-v1"

[oracle]
steps = [
  '''docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$WORKSPACE_DIR":/src -w /src golang:1.21 sh -c 'V=$(cat .gentar-version 2>/dev/null || git describe --tags --always --dirty 2>/dev/null || echo dev); GOCACHE=/tmp/gocache go build -ldflags "-X github.com/ramazanpolat/claude-playbooks/cmd.Version=$V" -o claude-playbook .' ''',
  'mkdir -p "$HOME/.local/bin" && install -m 755 "$WORKSPACE_DIR/claude-playbook" "$HOME/.local/bin/claude-playbook"',
  # An install fixture that is NOT a git clone, with a CLAUDE.md and a skills/
  # of its own, so wire must add a link beside an existing skill.
  '''FIX="$HOME/fixture-src"; mkdir -p "$FIX/skills/demo"; printf 'name = "fixture-pb"\n' > "$FIX/.playbook"; printf '# fixture playbook\n' > "$FIX/CLAUDE.md"; printf '# demo skill\n' > "$FIX/skills/demo/SKILL.md"''',
]

[[verify.commands]]
# The pilot on PATH is the pinned release. Asserted FIRST: every failure
# below is ambiguous if the template was built from another SHA.
command = '''P=$(readlink -f "$(command -v pilot)") && R=${P%/bin/pilot} && . "$WORKSPACE_DIR/gentar/bench-template/PILOT_PROFILE" && test "$(cat "$R/.pinned-sha")" = "$SHA" && echo pin-ok'''
contains = "pin-ok"

[[verify.commands]]
# create: exits 0, and the link only wire makes is there and resolves.
command = '''R=$(readlink -f "$(command -v pilot)"); R=${R%/bin/pilot}; claude-playbook create wired --no-alias && L="$HOME/.claude-playbooks/wired/skills/profile" && test -L "$L" && test -f "$L/SKILL.md" && test "$(readlink -f "$L")" = "$R/skill" && echo create-wired'''
contains = "create-wired"

[[verify.commands]]
# install: the same, into the DESTINATION (configDest) -- the source
# directory must come out untouched.
command = '''R=$(readlink -f "$(command -v pilot)"); R=${R%/bin/pilot}; claude-playbook install "$HOME/fixture-src" && L="$HOME/.claude-playbooks/fixture-pb/skills/profile" && test -L "$L" && test -f "$L/SKILL.md" && test "$(readlink -f "$L")" = "$R/skill" && test -f "$HOME/.claude-playbooks/fixture-pb/skills/demo/SKILL.md" && test ! -e "$HOME/fixture-src/skills/profile" && echo install-wired'''
contains = "install-wired"

[[verify.commands]]
# Idempotent (guarantee 2): a manual `wire --all` over the playbooks dir
# exits 0 and changes nothing -- no file, link or byte -- and each playbook
# carries exactly one import block.
command = '''snap() { (cd "$HOME/.claude-playbooks" && find . \( -type f -o -type l \) | sort | while read -r f; do if [ -L "$f" ]; then echo "$f -> $(readlink "$f")"; else echo "$f $(cksum < "$f")"; fi; done); }; A=$(snap); pilot wire --all "$HOME/.claude-playbooks" >/dev/null; rc=$?; B=$(snap); n=0; for pb in wired fixture-pb; do c=$(cat "$HOME/.claude-playbooks/$pb/CLAUDE.md" "$HOME/.claude-playbooks/$pb/CLAUDE.local.md" 2>/dev/null | grep -c '^@~/.pilot-profile/PROFILE.md$'); [ "$c" = 1 ] && n=$((n+1)); done; [ "$rc" = 0 ] && [ "$A" = "$B" ] && [ "$n" = 2 ] && echo idempotent'''
contains = "idempotent"

[[verify.commands]]
# Wiring never creates a profile (guarantee 4): the benches have none, and
# neither create, install nor wire may make one.
command = 'test ! -e "$HOME/.pilot-profile" && echo no-profile-created'
contains = "no-profile-created"
