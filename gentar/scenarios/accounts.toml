# claude-playbooks own-arena suite: accounts (v4.1.0).
#
# An account is an env set holding CLAUDE_CODE_OAUTH_TOKEN by reference.
# Attached, it is the playbook's account; --env-set picks another for one
# launch; REPLACE ENV switches for good. The launch execs through the
# secret helper, so the token reaches claude only, and a token exported in
# the shell never stands in for it. SELECT names the account, never the
# token. The login guard refuses a shared-login launch routed to an
# address that is not Anthropic's with no provider key, and lets it
# through once the router has its own key. An isolated playbook holding a
# /login of its own, launched on an account, has that login set aside for
# the run (unreadable to claude) and back afterwards (Linux).
#
# Stubs on PATH: `claude` dumps the environment it received and the
# credential store it can read; `arena-helper` is a secret helper that
# resolves stub:<name> references to secret-<name>, so a value differs
# from its reference and a leak check means something. Keyless: no real credentials.

[scenario]
name = "accounts"
subject = "claude-playbooks"
agent = "shell"

[oracle]
steps = [
  '''docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$WORKSPACE_DIR":/src -w /src golang:1.26 sh -c 'V=$(cat .gentar-version 2>/dev/null || git describe --tags --always --dirty 2>/dev/null || echo dev); GOCACHE=/tmp/gocache go build -ldflags "-X github.com/ramazanpolat/claude-playbooks/cmd.Version=$V" -o cpb .' ''',
  'mkdir -p "$HOME/.local/bin" && install -m 755 "$WORKSPACE_DIR/cpb" "$HOME/.local/bin/cpb"',
  '''printf '#!/bin/sh\nenv > "$HOME/claude-env"\ncp "$CLAUDE_CONFIG_DIR/.credentials.json" "$HOME/store-during" 2>/dev/null || : > "$HOME/store-during"\n' > "$HOME/.local/bin/claude" && chmod 755 "$HOME/.local/bin/claude"''',
  '''printf '#!/bin/sh\nif [ "$1" = --check ]; then exit 0; fi\nwhile [ "$1" != -- ]; do export "${1%%%%=*}=secret-${1#*=stub:}"; shift; done\nshift\nexec "$@"\n' > "$HOME/.local/bin/arena-helper" && chmod 755 "$HOME/.local/bin/arena-helper"''',
  "cpb ALTER DEFAULTS SET secret_helper = 'arena-helper'",
  "cpb CREATE ENV acct-work SET CLAUDE_CODE_OAUTH_TOKEN FROM 'stub:work'",
  "cpb CREATE ENV acct-personal SET CLAUDE_CODE_OAUTH_TOKEN FROM 'stub:personal'",
  "cpb CREATE PLAYBOOK sre SET launcher = '' USE ENV acct-work",
]

[[verify.files]]
path = "~/.claude-playbooks/.env-sets/acct-work.toml"

[[verify.commands]]
# The attached account's token reaches claude through the helper; one
# launch on the other account writes nothing back; SELECT names the
# account; no token is written under the playbooks root.
command = '''cpb run sre && grep -qx "CLAUDE_CODE_OAUTH_TOKEN=secret-work" "$HOME/claude-env" && cpb run --env-set acct-personal sre && grep -qx "CLAUDE_CODE_OAUTH_TOKEN=secret-personal" "$HOME/claude-env" && cpb SELECT name, token_source, token_account FROM PLAYBOOKS | grep -qx "$(printf 'sre\tenv-set:acct-work\tacct-work')" && ! grep -rq "secret-work" "$HOME/.claude-playbooks" && echo account-ok'''
contains = "account-ok"

[[verify.commands]]
# REPLACE ENV switches the account for good, and a token exported in the
# shell does not stand in for it.
command = '''cpb ALTER PLAYBOOK sre REPLACE ENV acct-work WITH acct-personal >/dev/null && CLAUDE_CODE_OAUTH_TOKEN=from-the-shell cpb run sre && grep -qx "CLAUDE_CODE_OAUTH_TOKEN=secret-personal" "$HOME/claude-env" && cpb EXPLAIN PLAYBOOK sre | grep -qF "Claude token: from env set acct-personal (the account, by reference)" && echo switch-ok'''
contains = "switch-ok"

[[verify.commands]]
# The login guard: a shared-login playbook routed to a router with no key
# is refused, claude never started; with the router's own key it launches.
command = '''cpb CREATE ENV router SET ANTHROPIC_BASE_URL=http://router.invalid/v1 >/dev/null && cpb CREATE PLAYBOOK routed SET launcher = '', login = 'shared' USE ENV router >/dev/null && rm -f "$HOME/claude-env" && if cpb run routed 2> "$HOME/guard.err"; then echo guard-let-it-through; exit 1; fi; test ! -f "$HOME/claude-env" && grep -qF "router.invalid, which is not Anthropic" "$HOME/guard.err" && cpb EXPLAIN PLAYBOOK routed --json | python3 -c 'import json,sys; g=json.load(sys.stdin)["route"]["guard"]; assert g["verdict"]=="refused", g' && cpb ALTER ENV router SET ANTHROPIC_AUTH_TOKEN FROM 'stub:router' >/dev/null && cpb run routed && grep -qx "ANTHROPIC_AUTH_TOKEN=secret-router" "$HOME/claude-env" && echo guard-ok'''
contains = "guard-ok"

[[verify.commands]]
# An isolated playbook with a /login of its own, launched on an account:
# the login is unreadable during the run and back afterwards, other keys
# kept, nothing left aside (Linux).
command = '''cpb CREATE PLAYBOOK own SET launcher = '', login = 'isolated' USE ENV acct-work >/dev/null && P="$HOME/.claude-playbooks/own" && (umask 077 && printf '%s' '{"claudeAiOauth":{"accessToken":"own-login","refreshToken":"r","expiresAt":1},"mcpOAuth":{"x":{"accessToken":"m"}}}' > "$P/.credentials.json") && cpb run own && grep -qx "CLAUDE_CODE_OAUTH_TOKEN=secret-work" "$HOME/claude-env" && ! grep -q claudeAiOauth "$HOME/store-during" && grep -q mcpOAuth "$HOME/store-during" && grep -q '"own-login"' "$P/.credentials.json" && test ! -e "$P/.credentials.json.cpb-aside" && echo aside-ok'''
contains = "aside-ok"
