# claude-playbooks own-arena suite: accounts (v4.2.0).
#
# An account is one record that says where a playbook's requests go and how
# they authenticate. A playbook names the accounts it may run on, the first
# by default; --account picks another it lists for one launch. The launch
# derives the routing and credential variables from the account, through the
# secret helper for a reference, so the token reaches claude only, and a
# token exported in the shell never stands in for it. SELECT names the
# account, never the token. A variable an account owns set anywhere else
# refuses the launch. An account that uses no Claude login keeps one out of
# the run: a shared playbook is refused; an isolated playbook's own /login is
# set aside for the run (unreadable to claude) and back afterwards on Linux.
# On macOS a token run leaves it in place with a claude that keeps the token
# on a 401 (2.1.225, since v4.3.2), and is refused before anything changes
# with an older or unknown one.
#
# Stubs on PATH: `claude` dumps the environment it received and the
# credential store it can read, and answers `claude --version` with
# $FAKE_CLAUDE_VERSION when that is set; `arena-helper` is a secret helper that
# resolves stub:<name> references to secret-<name>, so a value differs
# from its reference and a leak check means something. Keyless: no real credentials.

[scenario]
name = "accounts"
subject = "claude-playbooks"
agent = "shell"

[oracle]
steps = [
  '''docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$WORKSPACE_DIR":/src -w /src golang:1.26 sh -c 'V=$(cat .gentar-version 2>/dev/null || git describe --tags --always --dirty 2>/dev/null || echo dev); GOCACHE=/tmp/gocache go build -ldflags "-X github.com/ramazanpolat/claude-playbooks/cmd.Version=$V" -o cpb .' ''',
  'mkdir -p "$HOME/.local/bin" && install -m 755 "$WORKSPACE_DIR/cpb" "$HOME/.local/bin/cpb"',
  '''printf '#!/bin/sh\nif [ "$1" = --version ] && [ -n "$FAKE_CLAUDE_VERSION" ]; then echo "$FAKE_CLAUDE_VERSION (Claude Code)"; exit 0; fi\nenv > "$HOME/claude-env"\ncp "$CLAUDE_CONFIG_DIR/.credentials.json" "$HOME/store-during" 2>/dev/null || : > "$HOME/store-during"\n' > "$HOME/.local/bin/claude" && chmod 755 "$HOME/.local/bin/claude"''',
  '''printf '#!/bin/sh\nif [ "$1" = --check ]; then exit 0; fi\nprintf "%%s\\n" "${CLAUDE_CODE_OAUTH_TOKEN:-unset}" > "$HOME/helper-inherited"\nwhile [ "$1" != -- ]; do export "${1%%%%=*}=secret-${1#*=stub:}"; shift; done\nshift\nexec "$@"\n' > "$HOME/.local/bin/arena-helper" && chmod 755 "$HOME/.local/bin/arena-helper"''',
  "cpb ALTER DEFAULTS SET secret_helper = 'arena-helper'",
  "cpb CREATE ACCOUNT acct-work SET provider = 'anthropic', claude_token FROM 'stub:work'",
  "cpb CREATE ACCOUNT acct-personal SET provider = 'anthropic', claude_token FROM 'stub:personal'",
  "cpb CREATE ACCOUNT router SET provider = 'gateway', base_url = 'http://localhost:4000/v1', auth_token FROM 'stub:router', model = 'glm-5.3'",
  "cpb CREATE PLAYBOOK sre SET launcher = '' USE ACCOUNT acct-work, acct-personal",
]

[[verify.files]]
path = "~/.claude-playbooks/.accounts/acct-work.toml"

[[verify.commands]]
# The first account's token reaches claude through the helper; one launch
# on the other account it lists writes nothing back; SELECT names the
# account; no token is written under the playbooks root.
command = '''cpb run sre && grep -qx "CLAUDE_CODE_OAUTH_TOKEN=secret-work" "$HOME/claude-env" && cpb run --account acct-personal sre && grep -qx "CLAUDE_CODE_OAUTH_TOKEN=secret-personal" "$HOME/claude-env" && cpb SELECT name, token_source, account FROM PLAYBOOKS | grep -qx "$(printf 'sre\taccount\tacct-work')" && ! grep -rq "secret-work" "$HOME/.claude-playbooks" && echo account-ok'''
contains = "account-ok"

[[verify.commands]]
# USE ACCOUNT's order switches the default for good, and a token exported
# in the shell does not stand in for the account's: cpb removes it before
# the helper runs (the helper records what it inherited).
command = '''cpb ALTER PLAYBOOK sre USE ACCOUNT acct-personal, acct-work >/dev/null && CLAUDE_CODE_OAUTH_TOKEN=from-the-shell cpb run sre && grep -qx unset "$HOME/helper-inherited" && grep -qx "CLAUDE_CODE_OAUTH_TOKEN=secret-personal" "$HOME/claude-env" && cpb EXPLAIN PLAYBOOK sre | grep -qF "Account: acct-personal (anthropic, claude_token from a reference; the playbook's first)" && echo switch-ok'''
contains = "switch-ok"

[[verify.commands]]
# A gateway account: its address, key and model reach claude, no Claude
# credential does, and a shared playbook cannot run on it (claude never
# starts). A variable an account owns, set in an env set, refuses the
# launch and names the account that replaces it.
command = '''cpb CREATE PLAYBOOK routed SET launcher = '', login = 'isolated' USE ACCOUNT router >/dev/null && CLAUDE_CODE_OAUTH_TOKEN=from-the-shell cpb run routed && grep -qx "ANTHROPIC_BASE_URL=http://localhost:4000/v1" "$HOME/claude-env" && grep -qx "ANTHROPIC_AUTH_TOKEN=secret-router" "$HOME/claude-env" && grep -qx "ANTHROPIC_DEFAULT_MODEL=glm-5.3" "$HOME/claude-env" && ! grep -q "^CLAUDE_CODE_OAUTH_TOKEN=" "$HOME/claude-env" && cpb CREATE PLAYBOOK shared SET launcher = '', login = 'shared' USE ACCOUNT router >/dev/null && rm -f "$HOME/claude-env" && if cpb run shared 2> "$HOME/shared.err"; then echo shared-let-through; exit 1; fi; test ! -f "$HOME/claude-env" && grep -qF "shares the machine's Claude login" "$HOME/shared.err" && cpb CREATE ENV loose SET ANTHROPIC_BASE_URL=http://router.invalid/v1 >/dev/null && cpb CREATE PLAYBOOK loose SET launcher = '', login = 'isolated' USE ENV loose >/dev/null && if cpb run loose 2> "$HOME/loose.err"; then echo loose-let-through; exit 1; fi; test ! -f "$HOME/claude-env" && grep -qF "ANTHROPIC_BASE_URL, set by ENV loose" "$HOME/loose.err" && cpb EXPLAIN PLAYBOOK loose --json | python3 -c 'import json,sys; r=json.load(sys.stdin)["route"]; assert r["refused"], r' && echo gateway-ok'''
contains = "gateway-ok"

[[verify.commands]]
# A route stated in one env set, its address with its key, runs on a
# playbook that names no account, as an account derived for the launch: the
# key through the helper, no Claude credential, the shell's token removed;
# EXPLAIN and SELECT name it. Split across two layers it is refused.
command = '''cpb CREATE ENV onelayer SET ANTHROPIC_BASE_URL=http://localhost:4000/v1 ANTHROPIC_DEFAULT_OPUS_MODEL=glm-5.3 SET ANTHROPIC_AUTH_TOKEN FROM 'stub:onelayer' >/dev/null && cpb CREATE PLAYBOOK layered SET launcher = '', login = 'isolated' USE ENV onelayer >/dev/null && rm -f "$HOME/claude-env" && CLAUDE_CODE_OAUTH_TOKEN=from-the-shell cpb run layered && grep -qx "ANTHROPIC_BASE_URL=http://localhost:4000/v1" "$HOME/claude-env" && grep -qx "ANTHROPIC_AUTH_TOKEN=secret-onelayer" "$HOME/claude-env" && grep -qx "ANTHROPIC_DEFAULT_OPUS_MODEL=glm-5.3" "$HOME/claude-env" && ! grep -q "^CLAUDE_CODE_OAUTH_TOKEN=" "$HOME/claude-env" && cpb EXPLAIN PLAYBOOK layered | grep -qF "Account: env:onelayer (gateway http://localhost:4000/v1, auth_token from a reference; a route stated in ENV onelayer)" && cpb SELECT name, account FROM PLAYBOOKS | grep -qx "$(printf 'layered\tenv:onelayer')" && cpb CREATE ENV addronly SET ANTHROPIC_BASE_URL=http://localhost:4000/v1 >/dev/null && cpb CREATE PLAYBOOK split SET launcher = '', login = 'isolated' USE ENV addronly >/dev/null && cpb ALTER PLAYBOOK split SET VAR ANTHROPIC_AUTH_TOKEN FROM 'stub:split' >/dev/null && rm -f "$HOME/claude-env" && if cpb run split 2> "$HOME/split.err"; then echo split-let-through; exit 1; fi; test ! -f "$HOME/claude-env" && grep -qF "the address is stated in ENV addronly" "$HOME/split.err" && ! grep -q "secret-split" "$HOME/split.err" && echo one-layer-ok'''
contains = "one-layer-ok"

[[verify.commands]]
# An isolated playbook with a /login of its own, launched on a token
# account. Linux: the login is unreadable during the run and back
# afterwards, other keys kept, nothing left aside. macOS (the login lives
# in the Keychain): with a claude older than 2.1.225 or of an unknown
# version the launch is refused before anything changes, naming 2.1.225;
# with a newer one it runs on the account's token and the login stays in
# place, during the run and after, nothing set aside.
command = '''cpb CREATE PLAYBOOK own SET launcher = '', login = 'isolated' USE ACCOUNT acct-work >/dev/null && P="$HOME/.claude-playbooks/own" && (umask 077 && printf '%s' '{"claudeAiOauth":{"accessToken":"own-login","refreshToken":"r","expiresAt":1},"mcpOAuth":{"x":{"accessToken":"m"}}}' > "$P/.credentials.json") && if [ "$(uname)" = Darwin ]; then for v in 2.1.224 unknown; do rm -f "$HOME/claude-env"; if FAKE_CLAUDE_VERSION=$v cpb run own 2> "$HOME/own.err"; then echo own-login-let-through; exit 1; fi; test ! -f "$HOME/claude-env" && grep -qF "holds a login of its own" "$HOME/own.err" && grep -qF "2.1.225" "$HOME/own.err" && grep -qF "cpb run --account <account> own" "$HOME/own.err" && grep -q '"own-login"' "$P/.credentials.json" && test ! -e "$P/.credentials.json.cpb-aside" || { echo "refusal-wrong-$v"; exit 1; }; done; FAKE_CLAUDE_VERSION=2.1.302 cpb run own && grep -qx "CLAUDE_CODE_OAUTH_TOKEN=secret-work" "$HOME/claude-env" && grep -q '"own-login"' "$HOME/store-during" && grep -q '"own-login"' "$P/.credentials.json" && test ! -e "$P/.credentials.json.cpb-aside" && echo aside-ok; else cpb run own && grep -qx "CLAUDE_CODE_OAUTH_TOKEN=secret-work" "$HOME/claude-env" && ! grep -q claudeAiOauth "$HOME/store-during" && grep -q mcpOAuth "$HOME/store-during" && grep -q '"own-login"' "$P/.credentials.json" && test ! -e "$P/.credentials.json.cpb-aside" && echo aside-ok; fi'''
contains = "aside-ok"

[[verify.commands]]
# SHOW SESSIONS names each session's account (v4.8.0), from the record a
# launch keeps while it runs, on a real process: a stand-in claude that
# writes its own session file, as Claude Code does, and waits. One launch
# goes through a helper that execs claude (the record is claude's own pid),
# one through a helper that starts claude as its child (the record is the
# helper's, claude's parent). SELECT and the table have the column; a
# transcript that ends at Claude Code's limit error shows at_limit; the
# records are mode 600, hold no resolved value, and are gone with their
# launches.
command = '''
H="$HOME/holdbin"; L="$HOME/.claude-playbooks/.state/launches"; P="$HOME/.claude-playbooks/sesacct"; mkdir -p "$H"
S1=aaaaaaaa-0000-4000-8000-00000000000a; S2=bbbbbbbb-0000-4000-8000-00000000000b
cat > "$H/claude" <<'EOF'
#!/bin/sh
if [ "$1" = --version ]; then echo "2.1.322 (Claude Code)"; exit 0; fi
d="$CLAUDE_CONFIG_DIR/sessions"; mkdir -p "$d"
if [ -r "/proc/$$/stat" ]; then s=$(sed 's/.*) //' "/proc/$$/stat" | awk '{print $20}'); else s=$(TZ=UTC LC_ALL=C ps -o lstart= -p $$ | awk '{$1=$1; print}'); fi
printf '{"pid":%s,"sessionId":"%s","cwd":"%s","startedAt":%s000,"procStart":"%s","kind":"interactive","status":"busy"}\n' $$ "$SID" "$(pwd -P)" "$(date +%s)" "$s" > "$d/$$.json"
while [ ! -e "$HOME/hold.stop" ]; do sleep 0.1; done
rm -f "$d/$$.json"
EOF
cat > "$H/arena-fork-helper" <<'EOF'
#!/bin/sh
if [ "$1" = --check ]; then exit 0; fi
while [ "$1" != -- ]; do export "${1%%=*}=secret-${1#*=stub:}"; shift; done
shift
"$@"
EOF
chmod 755 "$H/claude" "$H/arena-fork-helper"; export PATH="$H:$PATH"
cpb CREATE PLAYBOOK sesacct SET launcher = '', login = 'isolated' USE ACCOUNT acct-personal, acct-work >/dev/null || exit 1
obj() { cpb SHOW SESSIONS --json | tr -d ' \n' | tr '}' '\n' | grep -F "\"session_id\":\"$1\""; }
w() { i=0; until obj "$1" | grep -qF "\"account\":\"$2\""; do i=$((i+1)); [ $i -lt 100 ] || return 1; sleep 0.1; done; }
SID=$S1 cpb run sesacct >/dev/null 2>&1 & R1=$!
trap 'touch "$HOME/hold.stop"' EXIT
w "$S1" acct-personal || { echo exec-helper-account-wrong; obj "$S1"; exit 1; }
cpb ALTER DEFAULTS SET secret_helper = 'arena-fork-helper' >/dev/null
SID=$S2 cpb run --account acct-work sesacct >/dev/null 2>&1 & R2=$!
w "$S2" acct-work || { echo fork-helper-account-wrong; obj "$S2"; exit 1; }
cpb ALTER DEFAULTS SET secret_helper = 'arena-helper' >/dev/null
P1="$(obj "$S1" | sed 's/.*"pid":\([0-9]*\).*/\1/')"; P2="$(obj "$S2" | sed 's/.*"pid":\([0-9]*\).*/\1/')"
F1="$(grep -l "\"pid\":$P1," "$L"/*.json 2>/dev/null | head -1)"
[ -n "$F1" ] && ! grep -lq "\"pid\":$P2," "$L"/*.json && [ "$(ls "$L" | wc -l | tr -d ' ')" = 2 ] || { echo records-wrong; ls -l "$L"; exit 1; }
[ "$(stat -c %a "$F1" 2>/dev/null || stat -f %Lp "$F1")" = 600 ] && ! grep -rq "secret-" "$L" || { echo record-mode-or-value-wrong; exit 1; }
cpb "SELECT session_id, account FROM SESSIONS" --json | tr -d ' \n' | grep -qF '"account":"acct-work"' && cpb SHOW SESSIONS | grep -q 'ACCOUNT' || { echo select-or-table-wrong; exit 1; }
E="$(pwd -P | sed 's/[^A-Za-z0-9]/-/g')"; mkdir -p "$P/projects/$E"
printf '{"type":"assistant","isApiErrorMessage":true,"error":"rate_limit","message":{"model":"<synthetic>"},"quotaLimits":{"status":"rejected","rateLimitType":"five_hour","resetsAt":%s}}\n' "$(( $(date +%s) + 3600 ))" > "$P/projects/$E/$S1.jsonl"
cpb SHOW SESSIONS --json | tr -d ' \n' | grep -qF '"at_limit":{"window":"five_hour","resets_at":"' && cpb SHOW SESSIONS | grep -q 'limit 5h' || { echo at-limit-wrong; exit 1; }
touch "$HOME/hold.stop"; wait $R1 $R2; rm -f "$HOME/hold.stop"
[ -z "$(ls -A "$L")" ] || { echo records-left; ls -l "$L"; exit 1; }
echo sessions-account-ok'''
contains = "sessions-account-ok"

[[verify.commands]]
# Account failover (v4.8.0), on a real process: a stand-in claude stops at a
# weekly limit that resets in two hours and waits, as Claude Code does (the
# limit line with its time and folder, the session file with its status,
# kind and start time), its transcript old enough that the quiet minutes
# have passed. The launch ends it and resumes the same
# session on the next listed account, through the secret helper, with that
# account's token and the continue prompt; EXPLAIN says it would. No
# resolved value is written in cpb's state; the setting is reset after.
command = '''
H="$HOME/fobin"; mkdir -p "$H" "$HOME/fowork"
cat > "$H/claude" <<'EOF'
#!/bin/sh
if [ "$1" = --version ]; then echo "2.1.322 (Claude Code)"; exit 0; fi
for a in "$@"; do [ "$a" = --resume ] && resumed=1; done
if [ -n "$resumed" ]; then printf '%s\n' "$@" > "$HOME/fo.args"; printf '%s' "$CLAUDE_CODE_OAUTH_TOKEN" > "$HOME/fo.token"; exit 0; fi
sid=0e5c1a2b-0000-4000-8000-0000000000f1
enc=$(printf %s "$(pwd -P)" | sed 's/[^A-Za-z0-9]/-/g'); mkdir -p "$CLAUDE_CONFIG_DIR/projects/$enc" "$CLAUDE_CONFIG_DIR/sessions"
t="$CLAUDE_CONFIG_DIR/projects/$enc/$sid.jsonl"
if [ -r "/proc/$$/stat" ]; then st=$(sed 's/.*) //' "/proc/$$/stat" | awk '{print $20}'); else st=$(TZ=UTC LC_ALL=C ps -o lstart= -p $$ | awk '{$1=$1; print}'); fi
sleep 1
printf '{"type":"assistant","cwd":"%s","timestamp":"%s","isApiErrorMessage":true,"error":"rate_limit","message":{"model":"<synthetic>"},"quotaLimits":{"status":"rejected","rateLimitType":"seven_day","resetsAt":%s}}\n' "$(pwd -P)" "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" $(( $(date +%s) + 7200 )) > "$t"
touch -t 202001010000 "$t"
sf="$CLAUDE_CONFIG_DIR/sessions/$$.json"
printf '{"pid":%s,"sessionId":"%s","cwd":"%s","startedAt":1,"procStart":"%s","kind":"interactive","status":"idle"}' $$ "$sid" "$(pwd -P)" "$st" > "$sf"
trap 'rm -f "$sf"; exit 143' TERM
while :; do sleep 1; done
EOF
chmod 755 "$H/claude"
cpb CREATE PLAYBOOK fo SET launcher = '', login = 'isolated' >/dev/null || exit 1
cpb ALTER DEFAULTS SET failover = 'on', failover_accounts = ['acct-work', 'acct-personal'] >/dev/null || exit 1
cpb EXPLAIN PLAYBOOK fo | grep -qF 'Failover: on (DEFAULTS); at a usage limit, the session moves to acct-work, acct-personal' || { echo explain-wrong; exit 1; }
cd "$HOME/fowork" && PATH="$H:$PATH" cpb run --account acct-work fo 2> "$HOME/fo.err" & R=$!
i=0; while kill -0 $R 2>/dev/null; do i=$((i+1)); if [ $i -ge 180 ]; then kill $R; pkill -f "$H/claude"; echo failover-timeout; cat "$HOME/fo.err"; exit 1; fi; sleep 0.5; done
wait $R || { echo run-failed; cat "$HOME/fo.err"; exit 1; }
grep -q 'resuming this session on acct-personal' "$HOME/fo.err" && grep -qx -- '--resume' "$HOME/fo.args" && grep -qx '0e5c1a2b-0000-4000-8000-0000000000f1' "$HOME/fo.args" && [ "$(cat "$HOME/fo.token")" = secret-personal ] || { echo switch-wrong; cat "$HOME/fo.err"; exit 1; }
grep -q '^\[cpb: this session moved from account acct-work (weekly limit' "$HOME/fo.args" || { echo prompt-wrong; exit 1; }
! grep -rq 'secret-' "$HOME/.claude-playbooks/.state" "$HOME/.claude-playbooks/.env-sets" 2>/dev/null || { echo value-in-state; exit 1; }
cpb ALTER DEFAULTS RESET failover, failover_accounts >/dev/null || exit 1
echo failover-ok'''
contains = "failover-ok"

[[verify.commands]]
# Usage (v4.8.0): a launch puts cpb's usage step in front of the playbook's
# own status line. A stand-in claude runs the launch's statusLine as Claude
# Code does, with figures in the input: the original runs and sees the cpb
# key (names only), SHOW USAGE has the figure. A working folder's own status
# line gets no step, and its command is never copied. No resolved value in
# cpb's state.
command = '''
H="$HOME/slbin"; mkdir -p "$H" "$HOME/slwork" "$HOME/slwork2/.claude"
cat > "$H/claude" <<'EOF'
#!/usr/bin/env python3
import json, os, subprocess, sys, time
if sys.argv[1:2] == ["--version"]:
    print("2.1.322 (Claude Code)"); sys.exit(0)
a = sys.argv[1:]
s = json.loads(a[a.index("--settings") + 1]) if "--settings" in a else {}
c = (s.get("statusLine") or {}).get("command")
if not c:
    open(os.environ["HOME"] + "/sl.out", "w").write("no-step"); sys.exit(0)
time.sleep(0.3); n = int(time.time())
i = {"session_id": "0e5c1a2b-0000-4000-8000-0000000000a2", "version": "2.1.322", "model": {"id": "claude-opus-5-5"},
     "rate_limits": {"five_hour": {"used_percentage": 40, "resets_at": n + 3600}, "seven_day": {"used_percentage": 100, "resets_at": n + 86400}}}
o = subprocess.run(["/bin/sh", "-c", c], input=json.dumps(i).encode(), capture_output=True)
open(os.environ["HOME"] + "/sl.out", "wb").write(o.stdout.strip())
EOF
chmod 755 "$H/claude"
cpb CREATE PLAYBOOK slp SET launcher = '', login = 'isolated', statusline.command = 'cat > "$HOME/sl.in"; echo shown' USE ACCOUNT acct-work >/dev/null || exit 1
cpb EXPLAIN PLAYBOOK slp | grep -qF "Usage at launch: recorded by cpb's status line step" || { echo explain-wrong; exit 1; }
cd "$HOME/slwork" && PATH="$H:$PATH" cpb run slp >/dev/null 2>&1 || { echo run-failed; exit 1; }
[ "$(cat "$HOME/sl.out")" = shown ] && grep -qF '"cpb":{"v":1,"account":{"name":"acct-work"}' "$HOME/sl.in" || { echo step-wrong; cat "$HOME/sl.out"; exit 1; }
cpb SHOW USAGE | grep -E '^acct-work ' | grep -q '40%' || { echo usage-wrong; cpb SHOW USAGE; exit 1; }
cpb SHOW USAGE --json | tr -d ' \n' | grep -qF '"seven_day":{"used_percentage":100,"left_percentage":0,' || { echo usage-json-wrong; exit 1; }
printf '{"statusLine":{"type":"command","command":"echo folder"}}' > "$HOME/slwork2/.claude/settings.json"
rm -f "$HOME/sl.out"; cd "$HOME/slwork2" && PATH="$H:$PATH" cpb run slp >/dev/null 2>&1; [ "$(cat "$HOME/sl.out")" = no-step ] || { echo folder-wrong; exit 1; }
! grep -rq 'secret-' "$HOME/.claude-playbooks/.state" || { echo value-in-state; exit 1; }
echo usage-ok'''
contains = "usage-ok"

[[verify.commands]]
# Session labels (v4.9.0): a launch label from --label, and a session label
# a hook sets from inside the session (cpb session label finds the session
# from its own ancestry). Both reach the status line's cpb key and SHOW
# SESSIONS, kept apart. Outside a session cpb launched it exits 3; a value
# shaped like an e-mail address is refused without being echoed. A launch
# from another playbooks root hands that root, absolute, to the session.
command = '''
H="$HOME/lbbin"; mkdir -p "$H" "$HOME/lbwork"
cat > "$H/claude" <<'EOF'
#!/usr/bin/env python3
import json, os, subprocess, sys, time
if sys.argv[1:2] == ["--version"]:
    print("2.1.322 (Claude Code)"); sys.exit(0)
sid, pid, h = "0e5c1a2b-0000-4000-8000-0000000000a3", os.getpid(), os.environ["HOME"]
try:
    st = open("/proc/%d/stat" % pid).read().rsplit(")", 1)[1].split()[19]
except OSError:
    st = " ".join(subprocess.run(["ps", "-o", "lstart=", "-p", str(pid)], env=dict(os.environ, TZ="UTC", LC_ALL="C"), capture_output=True, text=True).stdout.split())
d = os.environ["CLAUDE_CONFIG_DIR"] + "/sessions"; os.makedirs(d, exist_ok=True); f = d + "/%d.json" % pid
json.dump({"pid": pid, "sessionId": sid, "cwd": os.getcwd(), "startedAt": int(time.time() * 1000), "procStart": st, "kind": "interactive", "status": "busy"}, open(f, "w"))
try:
    # Claude Code renders after it starts; cpb records the launch once the process runs.
    L = h + "/.claude-playbooks/.state/launches"
    for _ in range(50):
        if os.path.isdir(L) and any(n.endswith(".json") for n in os.listdir(L)):
            break
        time.sleep(0.1)
    subprocess.run(["/bin/sh", "-c", "cpb session label task=triage"], check=True)
    a = sys.argv[1:]
    s = json.loads(a[a.index("--settings") + 1]) if "--settings" in a else {}
    c = (s.get("statusLine") or {}).get("command") or "true"
    subprocess.run(["/bin/sh", "-c", c], input=json.dumps({"session_id": sid, "version": "2.1.322", "model": {"id": "claude-opus-5-5"}}).encode())
    r = ""
    for _ in range(50):
        r = subprocess.run(["cpb", "SHOW", "SESSIONS", "--json"], capture_output=True, text=True).stdout
        if sid in r and '"account": "acct-work"' in r:
            break
        time.sleep(0.1)
    open(h + "/lb-sessions.json", "w").write(r)
finally:
    os.remove(f)
EOF
chmod 755 "$H/claude"
cpb CREATE PLAYBOOK lbp SET launcher = '', login = 'isolated', statusline.command = 'cat > "$HOME/lb.in"' USE ACCOUNT acct-work >/dev/null || exit 1
code=0; cpb session label task=x 2>/dev/null || code=$?; [ "$code" = 3 ] || { echo outside-wrong "$code"; exit 1; }
if cpb run --label 'owner=someone@example.com' lbp 2> "$HOME/lb.err"; then echo email-taken; exit 1; fi
grep -q 'label owner' "$HOME/lb.err" && ! grep -q 'someone@' "$HOME/lb.err" || { echo email-refusal-wrong; exit 1; }
cd "$HOME/lbwork" && PATH="$H:$PATH" cpb run --label name=review-auth lbp >/dev/null 2>&1 || { echo run-failed; exit 1; }
want='"labels":{"launch":{"name":"review-auth"},"session":{"task":"triage"}}'
grep -qF "$want" "$HOME/lb.in" || { echo key-wrong; cat "$HOME/lb.in"; exit 1; }
tr -d ' \n' < "$HOME/lb-sessions.json" | grep -qF "$want" || { echo sessions-wrong; cat "$HOME/lb-sessions.json"; exit 1; }
cpb --playbooks-dir "$HOME/lbroot" CREATE PLAYBOOK lbo SET launcher = '' >/dev/null || exit 1
cd "$HOME" && cpb --playbooks-dir lbroot run lbo >/dev/null 2>&1 || { echo root-run-failed; exit 1; }
grep -qx "CPB_PLAYBOOKS_DIR=$HOME/lbroot" "$HOME/claude-env" || { echo root-not-handed; exit 1; }
cpb ALTER PLAYBOOK lbp SET label_vars = "['LB_TAG']" >/dev/null || { echo label-vars-set-failed; exit 1; }
cpb ALTER PLAYBOOK lbp SET label_vars = "['GITHUB_TOKEN']" 2>/dev/null && { echo credential-name-taken; exit 1; }
cd "$HOME/lbwork" && LB_TAG=nightly PATH="$H:$PATH" cpb run lbp >/dev/null 2>&1 || { echo vars-run-failed; exit 1; }
grep -qF '"launch":{"env.lb_tag":"nightly"}' "$HOME/lb.in" || { echo label-vars-wrong; cat "$HOME/lb.in"; exit 1; }
env -u LB_TAG PATH="$H:$PATH" cpb run lbp 2> "$HOME/lbv.err" >/dev/null; grep -qF "label_vars left out: env.lb_tag (unset)" "$HOME/lbv.err" || { echo unset-note-wrong; exit 1; }
echo labels-ok'''
contains = "labels-ok"

[[verify.commands]]
# After every launch above: no resolved value (secret-<name>) was ever
# written under the playbooks root.
command = '! grep -rq "secret-" "$HOME/.claude-playbooks" && echo no-value-on-disk'
contains = "no-value-on-disk"
