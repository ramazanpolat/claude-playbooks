# claude-playbooks own-arena suite 2: docs-honesty — the README's
# documented install path, on the published release: install.sh and
# CPB_INSTALL_VERSION pinned to the same immutable tag (unpinned installs hit
# api.github.com rate limits from the shared bench egress IP, and a script
# from mutable main could drift under a pinned binary). Bump the pin
# deliberately when a release should be proven; cli-head-build covers the
# moving tip. The checksum-mismatch case uses the tag's own install.sh against
# a release served on loopback, since no published release is broken.

[scenario]
name = "cli-release-install"
subject = "claude-playbooks"
agent = "shell"

[oracle]
steps = [
  '''curl -fsSL https://raw.githubusercontent.com/ramazanpolat/claude-playbooks/v4.0.0-rc2/install.sh -o "$HOME/install.sh"''',
  '''CPB_INSTALL_VERSION=v4.0.0-rc2 CPB_INSTALL_DIR="$HOME/.local/bin" sh "$HOME/install.sh" > "$HOME/install.out" 2>&1''',
  # dlbad/v4.0.0-rc2: an asset that does not match the SHA256SUMS beside it.
  '''os=$(uname -s | tr '[:upper:]' '[:lower:]'); case $(uname -m) in x86_64|amd64) a=amd64;; aarch64|arm64) a=arm64;; esac; d="$HOME/fx/dlbad/v4.0.0-rc2"; mkdir -p "$d" && printf 'the published asset\n' > "$d/good" && (cd "$d" && { sha256sum good 2>/dev/null || shasum -a 256 good; } | sed "s/good\$/cpb-$os-$a/" > SHA256SUMS) && rm "$d/good" && printf 'not a binary\n' > "$d/cpb-$os-$a"''',
  # dllic/v4.0.0-rc2: a release with LICENSE and NOTICE beside its asset;
  # dlnolic/v4.0.0-rc2: one without them. The asset is the installed binary.
  '''os=$(uname -s | tr '[:upper:]' '[:lower:]'); case $(uname -m) in x86_64|amd64) a=amd64;; aarch64|arm64) a=arm64;; esac; for k in dllic dlnolic; do d="$HOME/fx/$k/v4.0.0-rc2"; mkdir -p "$d" && cp "$HOME/.local/bin/cpb" "$d/cpb-$os-$a" || exit 1; done; cp "$WORKSPACE_DIR/LICENSE" "$WORKSPACE_DIR/NOTICE" "$HOME/fx/dllic/v4.0.0-rc2/" && (cd "$HOME/fx/dllic/v4.0.0-rc2" && { sha256sum cpb-* LICENSE NOTICE 2>/dev/null || shasum -a 256 cpb-* LICENSE NOTICE; } > SHA256SUMS) && (cd "$HOME/fx/dlnolic/v4.0.0-rc2" && { sha256sum cpb-* 2>/dev/null || shasum -a 256 cpb-*; } > SHA256SUMS)''',
  # serve.sh DL CMD...: serve ~/fx on a free loopback port for the length of
  # CMD, with the download base pointed at ~/fx/DL. The server binds port 0
  # itself and reports what it got, so no port is picked and released for
  # someone else to take; the trap stops it however this script ends.
  '''cat > "$HOME/serve.sh" <<'EOF'
#!/bin/sh
dl=$1; shift
log=$(mktemp)
python3 -u -m http.server 0 --bind 127.0.0.1 --directory "$HOME/fx" >"$log" 2>&1 &
pid=$!
cpid=
trap 'kill "$pid" $cpid 2>/dev/null; rm -f "$log"' EXIT
trap 'exit 143' INT TERM HUP
i=0; port=
while [ -z "$port" ] && [ "$i" -lt 300 ]; do port=$(sed -n 's/.* port \([0-9][0-9]*\).*/\1/p' "$log" | head -1); i=$((i+1)); [ -n "$port" ] || { kill -0 "$pid" 2>/dev/null || break; sleep 0.1; }; done
[ -n "$port" ] || { echo "serve: server did not start; its output:" >&2; cat "$log" >&2; exit 3; }
export CPB_INSTALL_DOWNLOAD_BASE="http://127.0.0.1:$port/$dl"
"$@" & cpid=$!
wait "$cpid"
EOF
chmod +x "$HOME/serve.sh"''',
  # api.sh MODE CMD...: a stand-in for GitHub's releases/latest on a free
  # loopback port, for the length of CMD, with the API base pointed at it.
  # MODE is a status (200 answers tag v4.0.0-rc2, others an error body) or
  # "partial": a 200 whose body stops short of its Content-Length. Each
  # request's path and Authorization header (or "-") go to ~/api.log.
  '''cat > "$HOME/api.py" <<'PYEOF'
import http.server, os, sys
mode = sys.argv[1]
class H(http.server.BaseHTTPRequestHandler):
    def do_GET(self):
        with open(os.path.expanduser("~/api.log"), "a") as f:
            f.write(self.path + "\t" + (self.headers.get("Authorization") or "-") + "\n")
        code = 200 if mode == "partial" else int(mode)
        body = b'{"tag_name": "v4.0.0-rc2"}' if code == 200 else b'{"message": "API rate limit exceeded"}'
        self.send_response(code)
        self.send_header("Content-Type", "application/json")
        self.send_header("Content-Length", str(len(body) + (500 if mode == "partial" else 0)))
        self.end_headers()
        self.wfile.write(body)
    def log_message(self, *a):
        pass
s = http.server.HTTPServer(("127.0.0.1", 0), H)
print(s.server_address[1], flush=True)
s.serve_forever()
PYEOF
cat > "$HOME/api.sh" <<'SHEOF'
#!/bin/sh
mode=$1; shift
log=$(mktemp)
python3 -u "$HOME/api.py" "$mode" >"$log" 2>&1 &
pid=$!
cpid=
trap 'kill "$pid" $cpid 2>/dev/null; rm -f "$log"' EXIT
trap 'exit 143' INT TERM HUP
i=0; port=
while [ -z "$port" ] && [ "$i" -lt 300 ]; do port=$(grep -E '^[0-9]+$' "$log" | head -1); i=$((i+1)); [ -n "$port" ] || { kill -0 "$pid" 2>/dev/null || break; sleep 0.1; }; done
[ -n "$port" ] || { echo "api: server did not start; its output:" >&2; cat "$log" >&2; exit 3; }
export CPB_INSTALL_API_BASE="http://127.0.0.1:$port"
"$@" & cpid=$!
wait "$cpid"
SHEOF
chmod +x "$HOME/api.sh"''',
  # A curl that records its arguments and its stdin, and fails as an
  # unreachable host does: what install.sh hands curl, seen from outside.
  '''mkdir -p "$HOME/stubcurl" && printf '%s\n' '#!/bin/sh' 'printf "%s\n" "$@" > "$HOME/curl.args"' 'cat > "$HOME/curl.stdin"' 'printf 000' 'exit 7' > "$HOME/stubcurl/curl" && chmod 755 "$HOME/stubcurl/curl"''',
]

[[verify.files]]
path = "~/.local/bin/cpb"

[[verify.commands]]
command = "cpb --version"
contains = "cpb version v4.0.0-rc2"

[[verify.commands]]
# One regular file named cpb, and no second name: no claude-playbook, and no
# link beside it.
command = '''test -f "$HOME/.local/bin/cpb" && test ! -L "$HOME/.local/bin/cpb" && test ! -e "$HOME/.local/bin/claude-playbook" && [ -z "$(find "$HOME/.local/bin" -type l)" ] && echo one-file'''
contains = "one-file"

[[verify.commands]]
# The asset was checked against the release's SHA256SUMS.
command = '''grep -qF "Checksum verified (sha256)." "$HOME/install.out" && echo sums-verified'''
contains = "sums-verified"

[[verify.commands]]
# An asset that does not match its sums aborts, and installs nothing.
command = '''if "$HOME/serve.sh" dlbad env CPB_INSTALL_VERSION=v4.0.0-rc2 CPB_INSTALL_DIR="$HOME/bad" sh "$HOME/install.sh" > "$HOME/bad.out" 2>&1; then echo installed-a-mismatch; else grep -q "checksum mismatch for cpb-" "$HOME/bad.out" && [ -z "$(ls -A "$HOME/bad" 2>/dev/null)" ] && echo mismatch-refused; fi'''
contains = "mismatch-refused"

# The latest-release lookup, through this checkout's install.sh, so a change
# to it is tested before it is published: a rate limit is named as one, any other
# failure keeps a network message with the status, a failed transfer is no
# answer, and a GITHUB_TOKEN authenticates only GitHub's own API, never
# through curl's argv and never across a redirect.
[[verify.commands]]
# 403 and 429 are a rate limit, not the network; nothing is installed.
command = '''for c in 403 429; do if "$HOME/api.sh" $c env CPB_INSTALL_DIR="$HOME/rl$c" sh "$WORKSPACE_DIR/install.sh" > "$HOME/rl$c.out" 2>&1; then echo "installed-on-$c"; exit 1; fi; grep -qF "GitHub rate-limited this request (HTTP $c; unauthenticated requests share your IP): set CPB_INSTALL_VERSION=<tag> to skip the lookup, or retry later." "$HOME/rl$c.out" && ! grep -q "internet connection" "$HOME/rl$c.out" && [ -z "$(ls -A "$HOME/rl$c" 2>/dev/null)" ] || { echo "wrong-$c"; cat "$HOME/rl$c.out"; exit 1; }; done; echo rate-limit-named'''
contains = "rate-limit-named"

[[verify.commands]]
# Another status keeps a network message, with the status. No answer at
# all says so after curl's own reason, and so does a 200 cut short, whose
# partial body names a tag: nothing is installed.
command = '''if "$HOME/api.sh" 500 env CPB_INSTALL_DIR="$HOME/e500" sh "$WORKSPACE_DIR/install.sh" > "$HOME/e500.out" 2>&1; then echo installed-on-500; exit 1; fi; grep -q "could not determine the latest release (HTTP 500 from http://127.0.0.1:[0-9]*). Check your internet connection" "$HOME/e500.out" || { echo wrong-500; cat "$HOME/e500.out"; exit 1; }; if CPB_INSTALL_API_BASE=http://127.0.0.1:9 CPB_INSTALL_DIR="$HOME/e000" sh "$WORKSPACE_DIR/install.sh" > "$HOME/e000.out" 2>&1; then echo installed-unreachable; exit 1; fi; grep -qF "could not get an answer from http://127.0.0.1:9 to find the latest release" "$HOME/e000.out" && grep -q "^curl: (" "$HOME/e000.out" || { echo wrong-000; cat "$HOME/e000.out"; exit 1; }; if "$HOME/api.sh" partial env CPB_INSTALL_DIR="$HOME/ecut" sh "$WORKSPACE_DIR/install.sh" > "$HOME/ecut.out" 2>&1; then echo installed-on-a-cut-transfer; exit 1; fi; grep -q "could not get an answer from http://127.0.0.1:[0-9]*" "$HOME/ecut.out" && ! grep -q "Installing cpb" "$HOME/ecut.out" && [ -z "$(ls -A "$HOME/ecut" 2>/dev/null)" ] && echo network-named || { echo wrong-cut; cat "$HOME/ecut.out"; exit 1; }'''
contains = "network-named"

[[verify.commands]]
# A 200 answer's tag is the one installed (the download is the loopback
# release whose asset does not match its sums, so it stops there).
command = '''if "$HOME/serve.sh" dlbad "$HOME/api.sh" 200 env CPB_INSTALL_DIR="$HOME/ok200" sh "$WORKSPACE_DIR/install.sh" > "$HOME/ok200.out" 2>&1; then echo installed-a-mismatch; exit 1; fi; grep -q "Installing cpb from cpb-[a-z]*-[a-z0-9]* v4.0.0-rc2 " "$HOME/ok200.out" && grep -q "checksum mismatch for cpb-" "$HOME/ok200.out" && echo tag-from-api || { cat "$HOME/ok200.out"; exit 1; }'''
contains = "tag-from-api"

[[verify.commands]]
# GITHUB_TOKEN. On another API base it is not sent. On GitHub's API it
# reaches curl as a config line on stdin, never in its arguments, with no
# redirect followed; that exact line, replayed into the real curl, sends
# the header. A value with characters a token does not have is not sent,
# and is never printed.
command = '''rm -f "$HOME/api.log"; GITHUB_TOKEN=arena-not-a-token "$HOME/api.sh" 403 env CPB_INSTALL_DIR="$HOME/tk" sh "$WORKSPACE_DIR/install.sh" > /dev/null 2>&1; grep -q "^/repos/.*/releases/latest	-$" "$HOME/api.log" && ! grep -q arena-not-a-token "$HOME/api.log" || { echo token-sent-elsewhere; cat "$HOME/api.log"; exit 1; }; GITHUB_TOKEN=arena-not-a-token PATH="$HOME/stubcurl:$PATH" CPB_INSTALL_DIR="$HOME/tk2" sh "$WORKSPACE_DIR/install.sh" > "$HOME/tk2.out" 2>&1 < /dev/null; ! grep -q arena-not-a-token "$HOME/curl.args" && ! grep -q '^-[A-Za-z]*L' "$HOME/curl.args" && grep -qx 'header = "Authorization: Bearer arena-not-a-token"' "$HOME/curl.stdin" && grep -qx "https://api.github.com/repos/ramazanpolat/claude-playbooks/releases/latest" "$HOME/curl.args" && ! grep -q arena-not-a-token "$HOME/tk2.out" || { echo token-wrong; cat "$HOME/curl.args" "$HOME/tk2.out"; exit 1; }; rm -f "$HOME/api.log"; "$HOME/api.sh" 200 sh -c 'curl -sS -K - -o /dev/null "$CPB_INSTALL_API_BASE/x" < "$HOME/curl.stdin"'; grep -q "	Bearer arena-not-a-token$" "$HOME/api.log" || { echo config-line-not-sent; cat "$HOME/api.log"; exit 1; }; GITHUB_TOKEN='arena"bad' PATH="$HOME/stubcurl:$PATH" CPB_INSTALL_DIR="$HOME/tk3" sh "$WORKSPACE_DIR/install.sh" > "$HOME/tk3.out" 2>&1 < /dev/null; grep -q "Note: GITHUB_TOKEN has characters a GitHub token does not; the lookup runs without it." "$HOME/tk3.out" && ! grep -q 'arena"bad' "$HOME/tk3.out" "$HOME/curl.args" "$HOME/curl.stdin" && echo token-on-stdin || { echo bad-token-wrong; cat "$HOME/tk3.out"; exit 1; }'''
contains = "token-on-stdin"

[[verify.commands]]
# The licence travels with the binary: this checkout's install.sh puts the
# release's LICENSE and NOTICE in <prefix>/share/doc/cpb, byte for byte. A
# release without them still installs, with a note naming what is missing.
command = '''"$HOME/serve.sh" dllic env CPB_INSTALL_VERSION=v4.0.0-rc2 CPB_INSTALL_DIR="$HOME/lic/bin" sh "$WORKSPACE_DIR/install.sh" > "$HOME/lic.out" 2>&1 || { echo install-failed; cat "$HOME/lic.out"; exit 1; }; cmp -s "$HOME/lic/share/doc/cpb/LICENSE" "$WORKSPACE_DIR/LICENSE" && cmp -s "$HOME/lic/share/doc/cpb/NOTICE" "$WORKSPACE_DIR/NOTICE" && grep -qF "Licence: $HOME/lic/share/doc/cpb/LICENSE and NOTICE" "$HOME/lic.out" || { echo texts-not-placed; cat "$HOME/lic.out"; exit 1; }; "$HOME/serve.sh" dlnolic env CPB_INSTALL_VERSION=v4.0.0-rc2 CPB_INSTALL_DIR="$HOME/nolic/bin" sh "$WORKSPACE_DIR/install.sh" > "$HOME/nolic.out" 2>&1 && test -x "$HOME/nolic/bin/cpb" && grep -qF "Note: could not place LICENSE NOTICE in" "$HOME/nolic.out" && echo licence-shipped'''
contains = "licence-shipped"
