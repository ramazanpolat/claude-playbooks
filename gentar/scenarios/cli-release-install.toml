# claude-playbooks own-arena suite 2: docs-honesty — the README's
# documented install path, verbatim. Pin the VERSION (same policy as
# gentar's claude-playbooks-install suite): unpinned installs hit
# api.github.com rate limits from the shared bench egress IP, and a pin
# keeps the oracle reproducible. Bump the pin deliberately when a
# release should be proven; cli-head-build covers the moving tip.

[scenario]
name = "cli-release-install"
subject = "claude-playbooks"
agent = "shell"

[oracle]
steps = [
  "curl -fsSL https://raw.githubusercontent.com/ramazanpolat/claude-playbooks/main/install.sh | VERSION=v3.2.0 sh",
]

[[verify.files]]
path = "~/.local/bin/claude-playbook"

[[verify.files]]
path = "~/.local/bin/cpb"

[[verify.commands]]
command = "claude-playbook --version"
contains = "v3.2.0"
