# claude-playbooks own-arena suite 2: docs-honesty — the README's
# documented install path, on the published release: install.sh and
# CPB_INSTALL_VERSION pinned to the same immutable tag (unpinned installs hit
# api.github.com rate limits from the shared bench egress IP, and a script
# from mutable main could drift under a pinned binary). Bump the pin
# deliberately when a release should be proven; cli-head-build covers the
# moving tip. The checksum-mismatch case uses the tag's own install.sh against
# a release served on loopback, since no published release is broken.

[scenario]
name = "cli-release-install"
subject = "claude-playbooks"
agent = "shell"

[oracle]
steps = [
  '''curl -fsSL https://raw.githubusercontent.com/ramazanpolat/claude-playbooks/v4.0.0-rc1/install.sh -o "$HOME/install.sh"''',
  '''CPB_INSTALL_VERSION=v4.0.0-rc1 CPB_INSTALL_DIR="$HOME/.local/bin" sh "$HOME/install.sh" > "$HOME/install.out" 2>&1''',
  # dlbad/v4.0.0-rc1: an asset that does not match the SHA256SUMS beside it.
  '''os=$(uname -s | tr '[:upper:]' '[:lower:]'); case $(uname -m) in x86_64|amd64) a=amd64;; aarch64|arm64) a=arm64;; esac; d="$HOME/fx/dlbad/v4.0.0-rc1"; mkdir -p "$d" && printf 'the published asset\n' > "$d/good" && (cd "$d" && { sha256sum good 2>/dev/null || shasum -a 256 good; } | sed "s/good\$/cpb-$os-$a/" > SHA256SUMS) && rm "$d/good" && printf 'not a binary\n' > "$d/cpb-$os-$a"''',
  # serve.sh DL CMD...: serve ~/fx on a free loopback port for the length of
  # CMD, with the download base pointed at ~/fx/DL. The server binds port 0
  # itself and reports what it got, so no port is picked and released for
  # someone else to take; the trap stops it however this script ends.
  '''cat > "$HOME/serve.sh" <<'EOF'
#!/bin/sh
dl=$1; shift
log=$(mktemp)
python3 -u -m http.server 0 --bind 127.0.0.1 --directory "$HOME/fx" >"$log" 2>&1 &
pid=$!
cpid=
trap 'kill "$pid" $cpid 2>/dev/null; rm -f "$log"' EXIT
trap 'exit 143' INT TERM HUP
i=0; port=
while [ -z "$port" ] && [ "$i" -lt 300 ]; do port=$(sed -n 's/.* port \([0-9][0-9]*\).*/\1/p' "$log" | head -1); i=$((i+1)); [ -n "$port" ] || { kill -0 "$pid" 2>/dev/null || break; sleep 0.1; }; done
[ -n "$port" ] || { echo "serve: server did not start; its output:" >&2; cat "$log" >&2; exit 3; }
export CPB_INSTALL_DOWNLOAD_BASE="http://127.0.0.1:$port/$dl"
"$@" & cpid=$!
wait "$cpid"
EOF
chmod +x "$HOME/serve.sh"''',
]

[[verify.files]]
path = "~/.local/bin/cpb"

[[verify.commands]]
command = "cpb --version"
contains = "cpb version v4.0.0-rc1"

[[verify.commands]]
# One regular file named cpb, and no second name: no claude-playbook, and no
# link beside it.
command = '''test -f "$HOME/.local/bin/cpb" && test ! -L "$HOME/.local/bin/cpb" && test ! -e "$HOME/.local/bin/claude-playbook" && [ -z "$(find "$HOME/.local/bin" -type l)" ] && echo one-file'''
contains = "one-file"

[[verify.commands]]
# The asset was checked against the release's SHA256SUMS.
command = '''grep -qF "Checksum verified (sha256)." "$HOME/install.out" && echo sums-verified'''
contains = "sums-verified"

[[verify.commands]]
# An asset that does not match its sums aborts, and installs nothing.
command = '''if "$HOME/serve.sh" dlbad env CPB_INSTALL_VERSION=v4.0.0-rc1 CPB_INSTALL_DIR="$HOME/bad" sh "$HOME/install.sh" > "$HOME/bad.out" 2>&1; then echo installed-a-mismatch; else grep -q "checksum mismatch for cpb-" "$HOME/bad.out" && [ -z "$(ls -A "$HOME/bad" 2>/dev/null)" ] && echo mismatch-refused; fi'''
contains = "mismatch-refused"
