# claude-playbooks own-arena suite 7: environment overrides reach the
# child. A stub `claude` on PATH dumps the environment it received, so
# the manifest [env] block, an attached env set, the one-off launch
# flags (before and after the name, through the launcher too), an env
# file, and the `start -- --delete` boundary are all proven keylessly
# on the REAL launch path — nothing is inferred from the tool's own
# output. The stub shadows any real claude the template might carry.

[scenario]
name = "env-overrides"
subject = "claude-playbooks"
agent = "shell"

[oracle]
steps = [
  '''docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$WORKSPACE_DIR":/src -w /src golang:1.26 sh -c 'V=$(cat .gentar-version 2>/dev/null || git describe --tags --always --dirty 2>/dev/null || echo dev); GOCACHE=/tmp/gocache go build -ldflags "-X github.com/ramazanpolat/claude-playbooks/cmd.Version=$V" -o cpb .' ''',
  'mkdir -p "$HOME/.local/bin" && install -m 755 "$WORKSPACE_DIR/cpb" "$HOME/.local/bin/cpb"',
  '''printf '#!/bin/sh\nenv > "$HOME/claude-env"\n' > "$HOME/.local/bin/claude" && chmod 755 "$HOME/.local/bin/claude"''',
  'cpb CREATE PLAYBOOK env-pb',
  'cpb ALTER PLAYBOOK env-pb SET VAR FROM_MANIFEST=yes BLOCK VAR NOISY',
  'cpb CREATE ENV glm SET FROM_PROFILE=yes && cpb ALTER PLAYBOOK env-pb USE ENV glm',
]

[[verify.files]]
# Post-steps state: the block is recorded in the playbook's manifest.
path = "~/.claude-playbooks/env-pb/.playbook"

[[verify.files]]
path = "~/.claude-playbooks/.env-sets/glm.toml"

[[verify.commands]]
command = 'grep -F "sets = [\"glm\"]" "$HOME/.claude-playbooks/env-pb/.playbook" && grep -F "FROM_MANIFEST = \"yes\"" "$HOME/.claude-playbooks/env-pb/.playbook" && grep -F "block = [\"NOISY\"]" "$HOME/.claude-playbooks/env-pb/.playbook" && echo manifest-ok'
contains = "manifest-ok"

[[verify.commands]]
# The launch: the playbook's own variable and the env set's reach the
# child, the blocked variable is removed though exported, and
# CLAUDE_CONFIG_DIR is bound.
command = 'rm -f "$HOME/claude-env"; NOISY=1 cpb run env-pb && grep -x FROM_MANIFEST=yes "$HOME/claude-env" >/dev/null && grep -x FROM_PROFILE=yes "$HOME/claude-env" >/dev/null && ! grep -q "^NOISY=" "$HOME/claude-env" && grep -q "^CLAUDE_CONFIG_DIR=$HOME/.claude-playbooks/env-pb$" "$HOME/claude-env" && echo env-ok'
contains = "env-ok"

[[verify.commands]]
# An env set in use cannot be dropped; detached, it can.
command = 'if cpb DROP ENV glm >/dev/null 2>&1; then echo not-refused; else cpb ALTER PLAYBOOK env-pb DROP ENV glm >/dev/null && cpb DROP ENV glm >/dev/null && test ! -e "$HOME/.claude-playbooks/.env-sets/glm.toml" && echo delete-guarded; fi'
contains = "delete-guarded"

[[verify.commands]]
# One-off launch flags before and after the name, layered over the
# manifest, and nothing written back to it.
command = 'rm -f "$HOME/claude-env"; cp "$HOME/.claude-playbooks/env-pb/.playbook" "$HOME/manifest-before"; cpb run --env ONE_OFF=yes env-pb --block FROM_MANIFEST && grep -x ONE_OFF=yes "$HOME/claude-env" >/dev/null && ! grep -q "^FROM_MANIFEST=" "$HOME/claude-env" && cmp -s "$HOME/manifest-before" "$HOME/.claude-playbooks/env-pb/.playbook" && echo flags-ok'
contains = "flags-ok"

[[verify.commands]]
# An env file layer, and the launcher form with flags at the start.
command = 'printf "FROM_FILE=yes\n" > "$HOME/w.env"; rm -f "$HOME/claude-env"; cpb run --env-file "$HOME/w.env" env-pb && grep -x FROM_FILE=yes "$HOME/claude-env" >/dev/null && rm -f "$HOME/claude-env" && "$HOME/.local/bin/env-pb" --env VIA_LAUNCHER=yes && grep -x VIA_LAUNCHER=yes "$HOME/claude-env" >/dev/null && echo file-and-launcher-ok'
contains = "file-and-launcher-ok"

[[verify.commands]]
# An env set in DEFAULTS is the bottom layer of every launch; the
# playbook's own entry wins over it; DROP ENV is refused while it is there.
command = 'cpb CREATE ENV base SET FROM_DEFAULT=yes FROM_MANIFEST=default >/dev/null && cpb ALTER DEFAULTS USE ENV base >/dev/null && rm -f "$HOME/claude-env" && cpb run env-pb && grep -x FROM_DEFAULT=yes "$HOME/claude-env" >/dev/null && grep -x FROM_MANIFEST=yes "$HOME/claude-env" >/dev/null && if cpb DROP ENV base >/dev/null 2>&1; then echo default-delete-not-refused; else cpb ALTER DEFAULTS DROP ENV base >/dev/null && cpb DROP ENV base >/dev/null && echo default-ok; fi'
contains = "default-ok"

[[verify.commands]]
# `--delete` after `--` belongs to claude, never to the wrapper.
command = 'mkdir -p "$HOME/keepme"; cpb start "$HOME/keepme" -- --delete && test -d "$HOME/keepme" && grep -q "^CLAUDE_CONFIG_DIR=$HOME/keepme$" "$HOME/claude-env" && echo delete-boundary-ok'
contains = "delete-boundary-ok"

[[verify.commands]]
# No output form prints any character of a credential-looking value: a
# stored plaintext token, and one in an env set, are looked
# for whole and by their first and last 4 characters in SHOW, EXPLAIN,
# SELECT (human and --json), SHOW CREATE and SHOW ENV. The human forms say
# what it is and how long; an ordinary key alongside stays visible. The
# route (EXPLAIN --json) carries the base URL without its password.
command = '''T=qx7K0123456789abcdef01234567w9Zp; U=Mb3Rfedcba9876543210fedcbaQ8vT; O="$HOME/redact.out"; : > "$O"; W=pW7xRoutePassword4Q; cpb ALTER PLAYBOOK env-pb SET VAR THE_AUTH_TOKEN=$T AS PLAINTEXT >/dev/null && cpb CREATE ENV leaky SET SERVICE_API_KEY=$U AS PLAINTEXT >/dev/null && cpb ALTER PLAYBOOK env-pb SET VAR ANTHROPIC_BASE_URL=https://rt:$W@router.example:8443/v1 AS PLAINTEXT >/dev/null || { echo setup-failed; exit 1; }; for c in "SHOW PLAYBOOK env-pb" "SHOW PLAYBOOK env-pb --json" "EXPLAIN PLAYBOOK env-pb" "EXPLAIN PLAYBOOK env-pb --json" "SHOW ENV leaky" "SHOW ENV leaky --json" "SHOW ENVS --json"; do cpb $c >> "$O" 2>&1 || { echo "failed: $c"; exit 1; }; done; cpb "SELECT key, value, redacted FROM VARS" >> "$O" 2>&1 || { echo "failed: SELECT"; exit 1; }; cpb "SELECT key, value FROM VARS" --json >> "$O" 2>&1 || { echo "failed: SELECT --json"; exit 1; }; for c in "SHOW CREATE PLAYBOOK env-pb" "SHOW CREATE ALL"; do cpb $c > "$O.sc" 2>&1; grep -q "THE_AUTH_TOKEN=<withheld>" "$O.sc" || { echo "not withheld: $c"; exit 1; }; cat "$O.sc" >> "$O"; done; for s in $T qx7K w9Zp $U Mb3R Q8vT $W pW7x rd4Q; do if grep -qF "$s" "$O"; then echo "leaked: $s"; exit 1; fi; done; grep -qF "THE_AUTH_TOKEN=<plaintext, 32 chars>" "$O" && grep -qF "SERVICE_API_KEY=<plaintext, 30 chars>" "$O" && grep -qF "FROM_MANIFEST=yes" "$O" && cpb EXPLAIN PLAYBOOK env-pb --json | python3 -c 'import json,sys; r=json.load(sys.stdin)["route"]; assert r["host"]=="router.example:8443" and r["base_url"]=="https://router.example:8443/v1" and r["egress"]=="unknown", r' && echo redact-ok'''
contains = "redact-ok"
