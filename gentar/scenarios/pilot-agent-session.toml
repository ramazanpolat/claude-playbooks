# claude-playbooks own-arena suite 13: agent-in-the-loop -- a REAL agent,
# launched through a playbook, doing a real task.
#
# This is the only suite that tests what the product is FOR. Everything else
# proves the CLI manipulates directories correctly; none of it proves that a
# playbook launch produces a working, playbook-governed agent session. The
# launcher suite gets as far as `--version`.
#
# The verdict is deliberately indirect. The prompt asks for a file and never
# says what to put in it; the playbook's CLAUDE.md does. So a file with the
# right content can only mean the playbook's content reached the session --
# which is the entire claim `CLAUDE_CONFIG_DIR` isolation makes. The agent's
# own account of events is never consulted.
#
# The bench is OURS, not the shared gate template: claude-code 2.1.265+
# sends the Artifact tool, whose schema a third-party Anthropic-compatible
# backend can reject with 400 on every interactive turn (SPEC-v4.md), so the
# version this suite runs must not move on someone else's schedule. Built by
# gentar/bench-template/build.sh; the pin lives in its VERSION file and is
# asserted below, so a drifted template fails loudly.
#
# Credentials are tier-1 (env vars on a throwaway bench) and
# provider-agnostic: the coordinator refuses (exit 2) before any bench
# exists when none of the named variables is set, so this suite is left out
# of the arena's sweep unless one is present (see .github/workflows/arena.yml)
# while a direct dispatch still gets the honest refusal.

[scenario]
name = "pilot-agent-session"
subject = "claude-playbooks"
agent = "shell"
template = "cpb-agent-bench-v1"
# ALTERNATIVES, in preference order; a nested list is an all-of GROUP. A
# router token without its endpoint is half a provider, so the token and base
# URL travel together. Since gentar v0.2.0 only the WINNING group reaches the
# bench -- written as three flat names (as before v0.2.0), the lone token won,
# ANTHROPIC_BASE_URL was dropped as a stray, and the agent sent the router's
# token to Anthropic's API: "Invalid API key".
credentials = ["ANTHROPIC_API_KEY", ["ANTHROPIC_AUTH_TOKEN", "ANTHROPIC_BASE_URL"]]
# Model pins, forwarded when set. SLOT vars, never ANTHROPIC_MODEL:
# claude-code's catalog rejects unknown IDs on the main-model path, while the
# slot vars accept whatever the endpoint serves.
#
# ALL FOUR slots, not just one. claude-code picks a slot for itself, and an
# unpinned slot sends a literal Anthropic model ID to an endpoint that has
# never heard of it. Proven the hard way: with only SONNET pinned, the run
# died on "There's an issue with the selected model (claude-opus-5[1m])" --
# it had chosen the Opus slot. A routed endpoint must pin every slot it could
# be asked for, which is why the pilot's own router profiles set all four.
pass_env = [
  "ANTHROPIC_DEFAULT_SONNET_MODEL",
  "ANTHROPIC_DEFAULT_OPUS_MODEL",
  "ANTHROPIC_DEFAULT_HAIKU_MODEL",
  "ANTHROPIC_DEFAULT_FABLE_MODEL",
]

[oracle]
steps = [
  '''docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$WORKSPACE_DIR":/src -w /src golang:1.21 sh -c 'V=$(cat .gentar-version 2>/dev/null || git describe --tags --always --dirty 2>/dev/null || echo dev); GOCACHE=/tmp/gocache go build -ldflags "-X github.com/ramazanpolat/claude-playbooks/cmd.Version=$V" -o claude-playbook .' ''',
  'mkdir -p "$HOME/.local/bin" && install -m 755 "$WORKSPACE_DIR/claude-playbook" "$HOME/.local/bin/claude-playbook"',
  # Provider preflight, one token: is the endpoint answering THIS credential
  # right now? Recorded, never fatal here -- the verdict below reads it. When
  # this suite goes red, the first question is always "claude-playbooks, or
  # the provider?" (a routed endpoint's quota has produced a missing
  # marker.txt more than once), and without this the only answer was reading
  # the driver transcript. The key travels in a mode-600 header file, never
  # in argv, and the file is removed at once.
  '''umask 077; H="$HOME/.probe-h"; if [ -n "${ANTHROPIC_API_KEY:-}" ]; then printf 'x-api-key: %s\n' "$ANTHROPIC_API_KEY" > "$H"; B=https://api.anthropic.com; elif [ -n "${ANTHROPIC_AUTH_TOKEN:-}" ]; then printf 'Authorization: Bearer %s\n' "$ANTHROPIC_AUTH_TOKEN" > "$H"; B=${ANTHROPIC_BASE_URL:-https://api.anthropic.com}; else echo "provider-unprobed: no credential reached the oracle" > "$HOME/provider-probe.txt"; exit 0; fi; M=${ANTHROPIC_DEFAULT_HAIKU_MODEL:-claude-haiku-4-5}; code=$(curl -s -o "$HOME/.probe-body" -w '%{http_code}' --max-time 60 -H @"$H" -H 'anthropic-version: 2023-06-01' -H 'content-type: application/json' -d "{\"model\":\"$M\",\"max_tokens\":1,\"messages\":[{\"role\":\"user\",\"content\":\"ok\"}]}" "${B%/}/v1/messages"); rm -f "$H"; if [ "$code" = 200 ] && grep -q '"content"' "$HOME/.probe-body"; then r=provider-ok; else case $code in 429) r="provider-quota (HTTP 429)";; 401|403) r="provider-auth (HTTP $code)";; *) r="provider-error (HTTP $code)";; esac; r="$r: $(head -c 300 "$HOME/.probe-body" | tr -d '\n')"; fi; echo "$r" > "$HOME/provider-probe.txt"''',
  '"$HOME/.local/bin/claude-playbook" create pilotpb --no-alias',
  # The playbook's standing instruction. The prompt below never mentions
  # ORBIT-7 -- only this file does, so the marker's presence is proof the
  # session was governed by this playbook.
  '''printf '%s\n' '# Pilot playbook' '' 'Standing rule: whenever you are asked to create a marker file, its entire contents must be exactly the token ORBIT-7 and nothing else.' > "$HOME/.claude-playbooks/pilotpb/CLAUDE.md"''',
]

[driver]
# Headless -p: no turns, the file is the verdict. `timeout` bounds the CLI
# itself -- an expired credential makes claude-code print an execution error
# and retry indefinitely, which must fail honestly with the transcript
# attached rather than hang the bench. Startup update/telemetry checks are
# off; bench egress hangs on them.
command = 'cd "$WORKSPACE_DIR" && DISABLE_AUTOUPDATER=1 CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1 timeout 300 claude-playbook run pilotpb -p "Create a marker file named marker.txt in the current working directory." --dangerously-skip-permissions'

[budget]
# Declared ceiling for the guard, not measured usage. The arena's
# GENTAR_BUDGET_CAP must be >= this.
tokens = 25000

[[verify.commands]]
# The bench is the template we pinned. Asserted FIRST: every failure below
# is ambiguous if the agent that ran was a version this endpoint rejects.
command = 'claude --version'
contains = "2.1.234"

[[verify.commands]]
# The provider answered the preflight. Asserted before the agent's results:
# if this fails, the failures below are the provider's (quota, auth), not
# claude-playbooks' -- the output names which, with the HTTP status.
command = 'cat "$HOME/provider-probe.txt"'
contains = "provider-ok"

[[verify.commands]]
# The file exists where the agent was working.
command = 'test -f "$WORKSPACE_DIR/marker.txt" && echo marker-created'
contains = "marker-created"

[[verify.commands]]
# And carries the token only the playbook's CLAUDE.md supplied. Case- and
# whitespace-tolerant: the claim under test is that the instruction arrived,
# not that a model formats perfectly.
command = 'grep -qiF ORBIT-7 "$WORKSPACE_DIR/marker.txt" && echo playbook-governed'
contains = "playbook-governed"

[[verify.commands]]
# The session ran in the playbook's own config directory, so its state
# landed there rather than in a default ~/.claude.
command = 'test -e "$HOME/.claude-playbooks/pilotpb/.claude.json" && echo state-in-playbook'
contains = "state-in-playbook"
