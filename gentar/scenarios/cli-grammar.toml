# claude-playbooks own-arena suite: cli-grammar -- the statement grammar
# (docs/cli-grammar.md) on the REAL binary and launch path, and only the
# new code: env sets, DEFAULTS (a list, in order), playbook variables and
# env-set order, a secret reference resolved by a stub helper at launch,
# EXPLAIN / SHOW --json, SHOW CREATE feeding APPLY with no change, APPLY
# across files and its DROP PLAYBOOK guard, the source-drift warning, a bare
# SHOW, RENAME TO / ALIAS / NO ALIAS, DROP ENV refused while in use, the
# hidden env command keeping the grammar's formats, and a credential
# literal that is refused, then stored AS PLAINTEXT and never printed. A stub `claude` dumps
# the environment it received; a stub secret helper follows cpb's helper
# interface and resolves keychain:ok… references. No real secret exists.
# Also: INCLUDE stacking playbook files (a shared base runs once, a cycle is
# refused), and the plugin clauses against a second stub `claude` (in
# ~/fakeclaude, put first on PATH only there) that answers `claude plugin`
# and `claude mcp` and logs each call with its CLAUDE_CONFIG_DIR.
# v3.21.0: MCP servers (a credential header by reference, resolved only at
# launch), tools / status line / model in settings.json, skills (linked
# directory, copied git source), recipes (USE PLAYBOOK, TO <playbook>), TO a
# plain config directory (backup, refusals, state outside the directory),
# SELECT (built in, and through a stub clickhouse-local: the real one runs
# in GitHub CI's select-clickhouse job), and a git marketplace's #ref.
# v3.22.0: APPLY --dry-run --json, the model picker, the Claude Code minimum
# for the plugin clauses, and DESCRIBE (29 assertions in all: 28 commands,
# 1 file).

[scenario]
name = "cli-grammar"
subject = "claude-playbooks"
agent = "shell"

[oracle]
steps = [
  '''docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$WORKSPACE_DIR":/src -w /src golang:1.26 sh -c 'V=$(cat .gentar-version 2>/dev/null || git describe --tags --always --dirty 2>/dev/null || echo dev); GOCACHE=/tmp/gocache go build -ldflags "-X github.com/ramazanpolat/claude-playbooks/cmd.Version=$V" -o claude-playbook .' ''',
  'mkdir -p "$HOME/.local/bin" && install -m 755 "$WORKSPACE_DIR/claude-playbook" "$HOME/.local/bin/claude-playbook"',
  '''printf '#!/bin/sh\nenv > "$HOME/claude-env"\n' > "$HOME/.local/bin/claude" && chmod 755 "$HOME/.local/bin/claude"''',
  '''printf '%s\n' '#!/bin/sh' 'if [ "$1" = --check ]; then case "$2" in *=keychain:ok*) exit 0 ;; *) echo MISSING >&2; exit 4 ;; esac; fi' 'while [ $# -gt 0 ] && [ "$1" != -- ]; do k=${1%%=*}; r=${1#*=}; export "$k=resolved:$r"; shift; done' 'shift' 'exec "$@"' > "$HOME/.local/bin/test-helper" && chmod 755 "$HOME/.local/bin/test-helper"''',
  '''mkdir -p "$HOME/fakeclaude" && printf '%s\n' '#!/bin/sh' 'printf "%s|%s\n" "$CLAUDE_CONFIG_DIR" "$*" >> "$HOME/fake-claude.log"' 'st="$CLAUDE_CONFIG_DIR/.fake"; mkdir -p "$st"' 'case "$*" in' '"--version") [ -n "$FAKE_CLAUDE_VERSION" ] && echo "$FAKE_CLAUDE_VERSION (Claude Code)" || exit 2 ;;' '"plugin marketplace list --json") cat "$st/mkts" 2>/dev/null || echo "[]" ;;' '"plugin list --json") cat "$st/plugins" 2>/dev/null || echo "[]" ;;' '"plugin marketplace add https://"*) u=${4%%#*}; r=""; case "$4" in *#*) r=",\"ref\":\"${4#*#}\"" ;; esac; printf "[{\"name\":\"gitmkt\",\"source\":\"git\",\"url\":\"%s\"%s}]" "$u" "$r" > "$st/mkts" ;;' '"plugin marketplace add "*) printf "[{\"name\":\"%s\",\"source\":\"directory\",\"path\":\"%s\"}]" "$(basename "$4")" "$4" > "$st/mkts" ;;' '"plugin marketplace remove "*) echo "[]" > "$st/mkts" ;;' '"plugin install needs@"*) echo "{\"outcome\":\"failed\",\"message\":\"confirm\",\"shownCommand\":{\"command\":\"curl x | sh\",\"sha256\":\"abc123\"}}"; exit 1 ;;' '"plugin install "*) printf "[{\"id\":\"%s\",\"scope\":\"user\",\"enabled\":true}]" "$3" > "$st/plugins"; echo "{\"outcome\":\"ok\"}" ;;' '"plugin uninstall "*) echo "[]" > "$st/plugins"; echo "{\"outcome\":\"ok\"}" ;;' 'mcp\ add-json\ *) mkdir -p "$st/mcp"; if [ -e "$st/mcp/$3" ]; then echo "MCP server $3 already exists" >&2; exit 1; fi; printf "%s" "$4" > "$st/mcp/$3" ;;' 'mcp\ remove\ *) [ -e "$st/mcp/$3" ] || { echo "No MCP server named $3" >&2; exit 1; }; rm "$st/mcp/$3" ;;' '*) exit 2 ;;' 'esac' 'case "$1" in mcp) { printf "{\"mcpServers\":{"; sep=""; for f in "$st"/mcp/*; do [ -e "$f" ] || continue; printf "%s\"%s\":" "$sep" "$(basename "$f")"; cat "$f"; sep=","; done; printf "}}"; } > "$CLAUDE_CONFIG_DIR/.claude.json" ;;' 'esac' > "$HOME/fakeclaude/claude" && chmod 755 "$HOME/fakeclaude/claude"''',
  'claude-playbook CREATE PLAYBOOK gpb NO ALIAS',
  'claude-playbook CREATE ENV glm SET FROM_ENV=yes MODEL=glm DESCRIBE router',
  'claude-playbook ALTER DEFAULTS SET SECRET HELPER "$HOME/.local/bin/test-helper"',
  'claude-playbook ALTER ENV glm SET API_TOKEN FROM keychain:ok/glm',
  'claude-playbook ALTER PLAYBOOK gpb USE ENV glm SET VAR OWN=yes BLOCK VAR NOISY',
]

[[verify.files]]
path = "~/.claude-playbooks/.env-profiles/glm.toml"

[[verify.commands]]
# The launch execs through the helper: the reference resolves, the shell's
# stale value never reaches claude, the env set and the playbook's own
# layer apply, BLOCK removes an exported variable.
command = 'rm -f "$HOME/claude-env"; NOISY=1 API_TOKEN=stale-from-shell claude-playbook run gpb && grep -x FROM_ENV=yes "$HOME/claude-env" >/dev/null && grep -x OWN=yes "$HOME/claude-env" >/dev/null && grep -x API_TOKEN=resolved:keychain:ok/glm "$HOME/claude-env" >/dev/null && ! grep -q "^NOISY=" "$HOME/claude-env" && ! grep -q stale-from-shell "$HOME/claude-env" && echo launch-ok'
contains = "launch-ok"

[[verify.commands]]
# EXPLAIN --json names the reference and the layer that decided each key.
command = 'OUT=$(claude-playbook EXPLAIN PLAYBOOK gpb --json) && printf "%s" "$OUT" | grep -qF "\"ref\": \"keychain:ok/glm\"" && printf "%s" "$OUT" | grep -qF "\"kind\": \"ENV\"" && printf "%s" "$OUT" | grep -qF "\"blocked\": true" && printf "%s" "$OUT" | grep -qF "\"command\": \"$HOME/.local/bin/test-helper\"" && echo explain-ok'
contains = "explain-ok"

[[verify.commands]]
# A bare SHOW is SHOW PLAYBOOKS.
command = '[ "$(claude-playbook SHOW)" = "$(claude-playbook SHOW PLAYBOOKS)" ] && claude-playbook SHOW --json | grep -qF "\"name\": \"gpb\"" && echo bare-show-ok'
contains = "bare-show-ok"

[[verify.commands]]
# SHOW CREATE ALL writes a playbook file that APPLY finds already true:
# nothing created or changed, and no file differs.
command = 'sum() { find "$HOME/.claude-playbooks" \( -name .playbook -o -name "*.toml" -o -name .default -o -name .secret-helper \) -type f | sort | xargs cat | cksum; }; claude-playbook SHOW CREATE ALL > "$HOME/playbook.cpb" && B=$(sum) && claude-playbook APPLY "$HOME/playbook.cpb" > "$HOME/apply.out" && grep -q " 0 created, 0 changed," "$HOME/apply.out" && [ "$B" = "$(sum)" ] && echo roundtrip-ok'
contains = "roundtrip-ok"

[[verify.commands]]
# APPLY across two files, in order; a dry run writes nothing.
command = 'printf "CREATE OR REPLACE ENV extra SET E=1;\n" > "$HOME/a.cpb"; printf "ALTER PLAYBOOK gpb ADD ENV extra;\n" > "$HOME/b.cpb"; claude-playbook APPLY "$HOME/a.cpb" "$HOME/b.cpb" --dry-run >/dev/null && test ! -e "$HOME/.claude-playbooks/.env-profiles/extra.toml" && claude-playbook APPLY "$HOME/a.cpb" "$HOME/b.cpb" >/dev/null && grep -F "profiles = [\"glm\", \"extra\"]" "$HOME/.claude-playbooks/gpb/.playbook" >/dev/null && echo multi-file-ok'
contains = "multi-file-ok"

[[verify.commands]]
# A playbook file never consents to DROP PLAYBOOK on its own: refused and
# nothing written without --yes, dropped with it.
command = 'claude-playbook CREATE PLAYBOOK dpb NO ALIAS >/dev/null && printf "CREATE OR REPLACE ENV side;\nDROP PLAYBOOK dpb;\n" > "$HOME/drop.cpb" && if claude-playbook APPLY "$HOME/drop.cpb" >/dev/null 2>&1; then echo drop-not-refused; else test -d "$HOME/.claude-playbooks/dpb" && test ! -e "$HOME/.claude-playbooks/.env-profiles/side.toml" && claude-playbook APPLY "$HOME/drop.cpb" --yes >/dev/null && test ! -e "$HOME/.claude-playbooks/dpb" && echo drop-guard-ok; fi'
contains = "drop-guard-ok"

[[verify.commands]]
# Source drift is a warning, exit 0, nothing changed.
command = 'printf "CREATE PLAYBOOK IF NOT EXISTS gpb FROM https://example.com/other.git;\n" > "$HOME/drift.cpb" && claude-playbook APPLY "$HOME/drift.cpb" 2> "$HOME/drift.err" > "$HOME/drift.out" && grep -q "source differs" "$HOME/drift.err" && grep -q "1 warning(s)" "$HOME/drift.out" && echo drift-ok'
contains = "drift-ok"

[[verify.commands]]
# A credential literal is refused without AS PLAINTEXT, stored with it, and
# never printed by SHOW, EXPLAIN or SHOW CREATE.
command = 'S=sk-live-0123456789abcdef; if claude-playbook ALTER PLAYBOOK gpb SET VAR X_TOKEN=$S >/dev/null 2>&1; then echo literal-accepted; else claude-playbook ALTER PLAYBOOK gpb SET VAR X_TOKEN=$S AS PLAINTEXT >/dev/null && O=$( { claude-playbook SHOW PLAYBOOK gpb; claude-playbook SHOW PLAYBOOK gpb --json; claude-playbook EXPLAIN PLAYBOOK gpb; claude-playbook EXPLAIN PLAYBOOK gpb --json; claude-playbook SHOW CREATE PLAYBOOK gpb --skip-secrets; } 2>&1 ) && ! printf "%s" "$O" | grep -q "$S" && echo plaintext-ok; fi'
contains = "plaintext-ok"

[[verify.commands]]
# RENAME TO moves the playbook and ALIAS gives it a launcher; NO ALIAS
# removes the launcher again.
command = 'L=$(dirname "$(command -v claude-playbook)"); claude-playbook CREATE PLAYBOOK rpb NO ALIAS >/dev/null && claude-playbook ALTER PLAYBOOK rpb RENAME TO rpb2 ALIAS rl >/dev/null && test ! -e "$HOME/.claude-playbooks/rpb" && test -d "$HOME/.claude-playbooks/rpb2" && test -L "$L/rl" && claude-playbook ALTER PLAYBOOK rpb2 NO ALIAS >/dev/null && test ! -e "$L/rl" && echo rename-alias-ok'
contains = "rename-alias-ok"

[[verify.commands]]
# Env-set order is the manifest's list, and a later set wins at launch;
# ADD ENV … FIRST reorders it.
command = 'claude-playbook CREATE ENV o1 SET ORD=one >/dev/null && claude-playbook CREATE ENV o2 SET ORD=two >/dev/null && claude-playbook CREATE PLAYBOOK opb NO ALIAS >/dev/null && claude-playbook ALTER PLAYBOOK opb USE ENV o1 o2 >/dev/null && rm -f "$HOME/claude-env" && claude-playbook run opb && grep -x ORD=two "$HOME/claude-env" >/dev/null && claude-playbook ALTER PLAYBOOK opb ADD ENV o2 FIRST >/dev/null && grep -F "profiles = [\"o2\", \"o1\"]" "$HOME/.claude-playbooks/opb/.playbook" >/dev/null && rm -f "$HOME/claude-env" && claude-playbook run opb && grep -x ORD=one "$HOME/claude-env" >/dev/null && echo order-ok'
contains = "order-ok"

[[verify.commands]]
# DEFAULTS holds several env sets, layered in order under every playbook.
command = 'claude-playbook CREATE ENV d1 SET D1=yes SHARED=d1 >/dev/null && claude-playbook CREATE ENV d2 SET D2=yes SHARED=d2 >/dev/null && claude-playbook ALTER DEFAULTS USE ENV d1 d2 >/dev/null && [ "$(cat "$HOME/.claude-playbooks/.env-profiles/.default")" = "$(printf "d1\nd2")" ] && rm -f "$HOME/claude-env" && claude-playbook run opb && grep -x D1=yes "$HOME/claude-env" >/dev/null && grep -x D2=yes "$HOME/claude-env" >/dev/null && grep -x SHARED=d2 "$HOME/claude-env" >/dev/null && grep -x ORD=one "$HOME/claude-env" >/dev/null && echo defaults-list-ok'
contains = "defaults-list-ok"

[[verify.commands]]
# The --json of SHOW ENV and SHOW DEFAULTS carries default, used_by and
# where the secret helper came from.
command = 'claude-playbook SHOW ENV d1 --json | grep -qF "\"default\": true" && claude-playbook SHOW ENV o1 --json | grep -qF "\"opb\"" && D=$(claude-playbook SHOW DEFAULTS --json) && printf "%s" "$D" | grep -qF "\"d2\"" && printf "%s" "$D" | grep -qF "\"from\": \"setting\"" && CPB_SECRET_HELPER=other-helper claude-playbook SHOW DEFAULTS --json | grep -qF "\"from\": \"CPB_SECRET_HELPER\"" && echo show-json-ok'
contains = "show-json-ok"

[[verify.commands]]
# The hidden pre-grammar env command keeps its own path and the grammar's
# formats: it preserves a reference for another key, and a literal it sets
# replaces a reference for the same key.
command = 'M="$HOME/.claude-playbooks/gpb/.playbook"; claude-playbook ALTER PLAYBOOK gpb SET VAR PB_TOKEN FROM keychain:ok/pb >/dev/null && claude-playbook env gpb set OTHER=1 >/dev/null && grep -F "PB_TOKEN = \"keychain:ok/pb\"" "$M" >/dev/null && grep -F "OTHER = \"1\"" "$M" >/dev/null && claude-playbook env gpb set PB_TOKEN=literal >/dev/null && ! grep -F "keychain:ok/pb" "$M" >/dev/null && grep -F "PB_TOKEN = \"literal\"" "$M" >/dev/null && echo fallback-ok'
contains = "fallback-ok"

[[verify.commands]]
# DROP ENV is refused while a playbook, DEFAULTS, or a nested (subdir
# layout) manifest the launch reads still uses the set.
command = 'P="$HOME/.claude-playbooks"; claude-playbook CREATE ENV nest >/dev/null && mkdir -p "$P/npb/config" && printf "version = \"0.1.0\"\nname = \"npb\"\nsubdir = \"config\"\n" > "$P/npb/.playbook" && printf "version = \"0.1.0\"\nname = \"npb\"\n\n[env]\nprofiles = [\"nest\"]\n" > "$P/npb/config/.playbook" && for e in o1 d1 nest; do if claude-playbook DROP ENV $e >/dev/null 2>&1; then echo "dropped-in-use-$e"; exit 1; fi; done && test -e "$P/.env-profiles/o1.toml" && test -e "$P/.env-profiles/d1.toml" && test -e "$P/.env-profiles/nest.toml" && claude-playbook DROP ENV IF EXISTS never-was >/dev/null && echo drop-env-guard-ok'
contains = "drop-env-guard-ok"

[[verify.commands]]
# INCLUDE stacks playbook files: bare -> kommander -> chaos. The shared base,
# included twice (once through a symlink), runs once; the later layer wins
# (chaos's ADD ENV over kommander's USE ENV, at launch); a cycle is refused
# with its chain and nothing is written.
command = '''D="$HOME/inc"; mkdir -p "$D" && printf "CREATE OR REPLACE ENV ib SET LAYER=base;\nCREATE OR REPLACE ENV ik SET LAYER=kommander;\nCREATE OR REPLACE ENV ic SET LAYER=chaos;\nCREATE PLAYBOOK IF NOT EXISTS ipb NO ALIAS;\n" > "$D/base.cpb" && ln -sf base.cpb "$D/base-link.cpb" && printf "INCLUDE 'base.cpb';\nALTER PLAYBOOK ipb USE ENV ib ik;\n" > "$D/kommander.cpb" && printf "INCLUDE 'kommander.cpb';\nINCLUDE 'base-link.cpb';\nALTER PLAYBOOK ipb ADD ENV ic;\n" > "$D/chaos.cpb" && claude-playbook APPLY "$D/chaos.cpb" > "$D/apply.out" && grep -q " 4 created, 2 changed, 0 unchanged," "$D/apply.out" && grep -F "profiles = [\"ib\", \"ik\", \"ic\"]" "$HOME/.claude-playbooks/ipb/.playbook" >/dev/null && rm -f "$HOME/claude-env" && claude-playbook run ipb && grep -x LAYER=chaos "$HOME/claude-env" >/dev/null && printf "CREATE ENV cyc;\nINCLUDE 'b.cpb';\n" > "$D/a.cpb" && printf "INCLUDE 'a.cpb';\n" > "$D/b.cpb" && if claude-playbook APPLY "$D/a.cpb" > "$D/cyc.out" 2>&1; then echo cycle-accepted; else grep -q "INCLUDE cycle: .*a.cpb -> .*b.cpb -> .*a.cpb" "$D/cyc.out" && test ! -e "$HOME/.claude-playbooks/.env-profiles/cyc.toml" && echo include-ok; fi'''
contains = "include-ok"

[[verify.commands]]
# The plugin clauses run `claude plugin` with the playbook as
# CLAUDE_CONFIG_DIR: a dry run lists the commands and runs none; APPLY runs
# marketplace add and install and sets the agent; a repeat runs nothing;
# DROP MARKETPLACE is refused while its plugin is installed; a plugin that
# needs a marketplace-declared command fails and shows the confirm line.
command = '''export PATH="$HOME/fakeclaude:$PATH"; L="$HOME/fake-claude.log"; M="$HOME/mkt/loc"; mkdir -p "$M/.claude-plugin" && printf "{\"name\":\"loc\",\"owner\":{\"name\":\"t\"},\"plugins\":[]}\n" > "$M/.claude-plugin/marketplace.json" && claude-playbook CREATE PLAYBOOK kpb NO ALIAS >/dev/null && printf "ALTER PLAYBOOK kpb ADD MARKETPLACE loc FROM '$M' ADD PLUGIN hello@loc SET AGENT 'hello';\n" > "$HOME/plug.cpb" && claude-playbook APPLY "$HOME/plug.cpb" --dry-run > "$HOME/plug-dry.out" && grep -qF "would run: claude plugin marketplace add $M --scope user; claude plugin install hello@loc --scope user --json" "$HOME/plug-dry.out" && test -f "$L" && ! grep -Eq "\|plugin marketplace add|\|plugin install" "$L" && claude-playbook APPLY "$HOME/plug.cpb" >/dev/null && grep -qF "/kpb|plugin marketplace add $M --scope user" "$L" && grep -qF "/kpb|plugin install hello@loc --scope user --json" "$L" && grep -qF "\"agent\": \"hello\"" "$HOME/.claude-playbooks/kpb/settings.json" && claude-playbook APPLY "$HOME/plug.cpb" > "$HOME/plug-again.out" && grep -q " 0 created, 0 changed, 1 unchanged," "$HOME/plug-again.out" && [ "$(grep -c "|plugin install hello@loc" "$L")" = 1 ] && if claude-playbook ALTER PLAYBOOK kpb DROP MARKETPLACE loc > "$HOME/plug-drop.out" 2>&1; then echo drop-not-refused; elif ! grep -q "plugins still use it: hello@loc" "$HOME/plug-drop.out"; then echo drop-wrong-error; elif claude-playbook ALTER PLAYBOOK kpb ADD PLUGIN needs@loc > "$HOME/plug-needs.out" 2>&1; then echo command-accepted; else grep -qF -- "--accept-command abc123" "$HOME/plug-needs.out" && echo plugins-ok; fi'''
contains = "plugins-ok"

# --- v3.21.0: an agent's configuration, targets and SELECT (new code only;
# assertions confirmed by root as the pilot's delegate, 2026-09-27) ---

[[verify.commands]]
# MCP servers run `claude mcp add-json` with the playbook as
# CLAUDE_CONFIG_DIR. A credential header is a reference: Claude's config gets
# only ${CPB_MCP_…}, the launch gets it resolved, SHOW and EXPLAIN show the
# reference and never a resolved value. A repeat runs nothing, a literal
# credential is refused, DROP runs `mcp remove` and forgets the reference.
command = '''O=$PATH; export PATH="$HOME/fakeclaude:$PATH"; L="$HOME/fake-claude.log"; P="$HOME/.claude-playbooks/mpb"; A="ALTER PLAYBOOK mpb ADD MCP SERVER files COMMAND 'npx' ARGS '-y' 'server-fs' '/srv' ADD MCP SERVER sentry URL 'https://mcp.example/mcp' HEADER 'Authorization' FROM 'keychain:ok/sentry'"; claude-playbook CREATE PLAYBOOK mpb NO ALIAS >/dev/null && claude-playbook "$A" >/dev/null && grep -qF "/mpb|mcp add-json files " "$L" && grep -qF "/mpb|mcp add-json sentry " "$L" && grep -Eq '"Authorization": ?"\$\{CPB_MCP_SENTRY_H_AUTHORIZATION_[0-9a-fA-F]{8}\}"' "$P/.claude.json" && test -f "$P/.claude.json" && ! grep -Eq "keychain:|resolved:" "$P/.claude.json" && grep -qF "keychain:ok/sentry" "$P/.playbook" && rm -f "$HOME/claude-env" && env PATH="$O" claude-playbook run mpb && grep -Eq "^CPB_MCP_SENTRY_H_AUTHORIZATION_[0-9a-fA-F]{8}=resolved:keychain:ok/sentry$" "$HOME/claude-env" && V=$( { claude-playbook SHOW PLAYBOOK mpb --json; claude-playbook EXPLAIN PLAYBOOK mpb; claude-playbook EXPLAIN PLAYBOOK mpb --json; claude-playbook SHOW CREATE PLAYBOOK mpb; } 2>&1 ) && printf "%s" "$V" | grep -qF "keychain:ok/sentry" && ! printf "%s" "$V" | grep -q "resolved:" && printf "%s" "$V" | grep -qF "HEADER 'Authorization' FROM 'keychain:ok/sentry'" && claude-playbook "$A" | grep -q unchanged && [ "$(grep -c "|mcp add-json sentry " "$L")" = 1 ] && if claude-playbook "ALTER PLAYBOOK mpb ADD MCP SERVER lit URL 'https://x.example/mcp' HEADER 'Authorization' 'Bearer abc'" >/dev/null 2>&1; then echo literal-credential-accepted; elif grep -q "mcp add-json lit" "$L"; then echo literal-ran; else claude-playbook ALTER PLAYBOOK mpb DROP MCP SERVER sentry >/dev/null && test -f "$P/.playbook" && test -f "$P/.claude.json" && grep -qF "/mpb|mcp remove sentry --scope user" "$L" && ! grep -qF "keychain:ok/sentry" "$P/.playbook" && ! grep -q '"sentry"' "$P/.claude.json" && grep -q '"files"' "$P/.claude.json" && echo mcp-ok; fi'''
contains = "mcp-ok"

[[verify.commands]]
# Tools, status line and model land in settings.json and keep a key cpb did
# not write; allowing a denied rule moves it; EXPLAIN shows the tools, and
# that an env set's ANTHROPIC_MODEL decides over SET MODEL; UNSET removes.
command = '''P="$HOME/.claude-playbooks/spb"; c() { tr -d ' \n' < "$P/settings.json"; }; claude-playbook CREATE PLAYBOOK spb NO ALIAS >/dev/null && printf '{"theme": "dark"}\n' > "$P/settings.json" && claude-playbook "ALTER PLAYBOOK spb DENY TOOL 'Bash(rm *)' ALLOW TOOL 'Bash(git diff *)' SET STATUSLINE 'echo spb' SET MODEL 'claude-opus-5-5'" >/dev/null && c | grep -qF '"theme":"dark"' && c | grep -qF '"allow":["Bash(gitdiff*)"]' && c | grep -qF '"deny":["Bash(rm*)"]' && c | grep -qF '"statusLine":{"type":"command","command":"echospb"}' && c | grep -qF '"model":"claude-opus-5-5"' && claude-playbook EXPLAIN PLAYBOOK spb | grep -qxF "Tools: allow Bash(git diff *); deny Bash(rm *)" && claude-playbook EXPLAIN PLAYBOOK spb | grep -qF "Model: claude-opus-5-5 (playbook settings)" && claude-playbook "ALTER PLAYBOOK spb ALLOW TOOL 'Bash(rm *)'" >/dev/null && c | grep -qF '"allow":["Bash(gitdiff*)","Bash(rm*)"]' && ! c | grep -qF '"deny":["Bash(rm*)"]' && claude-playbook CREATE ENV mdl SET ANTHROPIC_MODEL=glm-x >/dev/null && claude-playbook ALTER PLAYBOOK spb ADD ENV mdl >/dev/null && claude-playbook EXPLAIN PLAYBOOK spb | grep -qF "Model: glm-x (ANTHROPIC_MODEL); the settings model claude-opus-5-5 is overridden" && claude-playbook "ALTER PLAYBOOK spb UNSET TOOL 'Bash(rm *)' 'Bash(git diff *)' UNSET STATUSLINE UNSET MODEL" >/dev/null && test -f "$P/settings.json" && ! c | grep -Eq 'Bash\(|statusLine|"model"' && c | grep -qF '"theme":"dark"' && echo agent-settings-ok'''
contains = "agent-settings-ok"

[[verify.commands]]
# ADD SKILL from a directory links it and records it; a repeat is unchanged;
# a skills/<x> cpb did not add is refused by ADD and DROP; DROP SKILL removes
# the link and never the linked directory.
