# claude-playbooks own-arena suite 16: `cpb self-update` -- the installed
# binary replacing itself, within its major version.
#
# Unit tests run the whole update against an httptest server; this runs it
# with a real installed binary and a real release layout: a GitHub-shaped
# release list, `cpb-<os>-<arch>` assets and their SHA256SUMS. Until v4.0.0
# is published there is no v4 release to use, so the releases are fixtures
# served on loopback, built from this checkout and stamped:
#   v4.0.0  the start point, installed through install.sh;
#   v4.0.1  the update within the major (a real build: it updates again);
#   v5.0.0  a new major, which self-update names and does not take without
#           --major (a stub that prints its version);
#   v4.1.0-rc1, a pre-release, which is never taken.
# The list is served without a Link header, so it is one page.
#
# Mid-sequence state is proven inside chained commands -- gentar runs
# verify.files (post-steps only) before verify.commands, in order.

[scenario]
name = "cli-self-update"
subject = "claude-playbooks"
agent = "shell"

[oracle]
steps = [
  '''docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$WORKSPACE_DIR":/src -w /src golang:1.26 sh -c 'for v in v4.0.0 v4.0.1; do GOCACHE=/tmp/gocache go build -ldflags "-X github.com/ramazanpolat/claude-playbooks/cmd.Version=$v" -o .fixture-$v . || exit 1; done' ''',
  # dl/<tag>/{cpb-<os>-<arch>,SHA256SUMS}; dlbad/v4.0.1 holds an asset that
  # does not match the real sums beside it.
  '''os=$(uname -s | tr '[:upper:]' '[:lower:]'); case $(uname -m) in x86_64|amd64) a=amd64;; aarch64|arm64) a=arm64;; esac; F="$HOME/fx"; sums() { (cd "$1" && { sha256sum "cpb-$os-$a" 2>/dev/null || shasum -a 256 "cpb-$os-$a"; } > SHA256SUMS); }; for v in v4.0.0 v4.0.1; do mkdir -p "$F/dl/$v" && cp "$WORKSPACE_DIR/.fixture-$v" "$F/dl/$v/cpb-$os-$a" && sums "$F/dl/$v" || exit 1; done; mkdir -p "$F/dl/v5.0.0" "$F/dlbad/v4.0.1" && printf '#!/bin/sh\necho "cpb version v5.0.0"\n' > "$F/dl/v5.0.0/cpb-$os-$a" && chmod 755 "$F/dl/v5.0.0/cpb-$os-$a" && sums "$F/dl/v5.0.0" && cp "$F/dl/v4.0.1/SHA256SUMS" "$F/dlbad/v4.0.1/" && printf 'not a binary\n' > "$F/dlbad/v4.0.1/cpb-$os-$a"''',
  # A stand-in for api.github.com: the release list, newest by date first,
  # and a broken one (not JSON) under api-bad/.
  '''R=repos/ramazanpolat/claude-playbooks; mkdir -p "$HOME/fx/api/$R" "$HOME/fx/api-bad/$R" && printf '[{"tag_name":"v5.0.0","draft":false,"prerelease":false},{"tag_name":"v4.1.0-rc1","draft":false,"prerelease":true},{"tag_name":"v4.0.1","draft":false,"prerelease":false},{"tag_name":"v4.0.0","draft":false,"prerelease":false}]\n' > "$HOME/fx/api/$R/releases" && printf '[{"tag_name":\n' > "$HOME/fx/api-bad/$R/releases"''',
  # serve.sh API DL CMD...: serve ~/fx on a free loopback port for the length
  # of CMD, with self-update's API base at ~/fx/API and the download base (for
  # install.sh too) at ~/fx/DL. One server per command; the trap stops it
  # however the script ends.
  '''cat > "$HOME/serve.sh" <<'EOF'
#!/bin/sh
api=$1 dl=$2; shift 2
log=$(mktemp)
python3 -u -m http.server 0 --bind 127.0.0.1 --directory "$HOME/fx" >"$log" 2>&1 &
pid=$!
cpid=
trap 'kill "$pid" $cpid 2>/dev/null; rm -f "$log"' EXIT
trap 'exit 143' INT TERM HUP
i=0; port=
while [ -z "$port" ] && [ "$i" -lt 300 ]; do port=$(sed -n 's/.* port \([0-9][0-9]*\).*/\1/p' "$log" | head -1); i=$((i+1)); [ -n "$port" ] || { kill -0 "$pid" 2>/dev/null || break; sleep 0.1; }; done
[ -n "$port" ] || { echo "serve: server did not start; its output:" >&2; cat "$log" >&2; exit 3; }
export CPB_UPDATE_API_BASE="http://127.0.0.1:$port/$api"
export CPB_UPDATE_DOWNLOAD_BASE="http://127.0.0.1:$port/$dl" CPB_INSTALL_DOWNLOAD_BASE="http://127.0.0.1:$port/$dl"
"$@" & cpid=$!
wait "$cpid"
EOF
chmod +x "$HOME/serve.sh"''',
  '''"$HOME/serve.sh" api dl env CPB_INSTALL_VERSION=v4.0.0 CPB_INSTALL_DIR="$HOME/.local/bin" sh "$WORKSPACE_DIR/install.sh" >/dev/null''',
]

[[verify.files]]
path = "~/.local/bin/cpb"

[[verify.commands]]
# The start point is the v4.0.0 fixture.
command = "cpb --version"
contains = "cpb version v4.0.0"

[[verify.commands]]
# --check names the newest v4 and the newest overall, says v5 needs
# --major, and replaces nothing.
command = '''out=$("$HOME/serve.sh" api dl cpb self-update --check) && echo "$out" | grep -qxF 'Newest v4 release: v4.0.1' && echo "$out" | grep -qxF 'Newest release:  v5.0.0' && echo "$out" | grep -qF 'v5.0.0 is available, a new major version: run `cpb self-update --major` (read its release notes first)' && echo "$out" | grep -qF 'v4.0.0 -> v4.0.1' && cpb --version | grep -qF v4.0.0 && echo check-only-ok'''
contains = "check-only-ok"

[[verify.commands]]
# A release list that cannot be read fails closed: nonzero, the reason,
# nothing installed.
command = '''out=$("$HOME/serve.sh" api-bad dl cpb self-update 2>&1); rc=$?; [ "$rc" != 0 ] && echo "$out" | grep -qF "could not read the release list, so nothing is installed" && cpb --version | grep -qF v4.0.0 && echo fail-closed-ok'''
contains = "fail-closed-ok"

[[verify.commands]]
# A download that fails its checksum is refused: nonzero exit, the old binary
# still in place and still running, no staged temp file left beside it.
command = '''out=$("$HOME/serve.sh" api dlbad cpb self-update 2>&1); rc=$?; [ "$rc" != 0 ] && echo "$out" | grep -qi checksum && cpb --version | grep -qF v4.0.0 && [ -z "$(ls -A "$HOME/.local/bin" | grep '^\.cpb\.update-')" ] && echo corrupt-refused'''
contains = "corrupt-refused"

[[verify.commands]]
# The real update, within the major: v4.0.1, not v5.0.0 and not the rc, with
# v5 named; nothing left staged.
command = '''out=$("$HOME/serve.sh" api dl cpb self-update) && echo "$out" | grep -qF 'Updated to v4.0.1' && echo "$out" | grep -qF 'v5.0.0 is available, a new major version' && cpb --version | grep -qF 'cpb version v4.0.1' && [ -z "$(ls -A "$HOME/.local/bin" | grep '^\.cpb\.update-')" ] && echo updated-in-major'''
contains = "updated-in-major"

[[verify.commands]]
# A second run is a no-op, and still names v5.
command = '''out=$("$HOME/serve.sh" api dl cpb self-update) && echo "$out" | grep -qF 'Already up to date.' && echo "$out" | grep -qF 'v5.0.0 is available' && echo up-to-date'''
contains = "up-to-date"

[[verify.commands]]
# --major takes the new major.
command = '''out=$("$HOME/serve.sh" api dl cpb self-update --major) && echo "$out" | grep -qF 'Updated to v5.0.0' && cpb --version | grep -qF 'cpb version v5.0.0' && echo major-ok'''
contains = "major-ok"
