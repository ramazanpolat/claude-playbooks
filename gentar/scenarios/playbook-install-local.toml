# claude-playbooks own-arena suite 4: CREATE PLAYBOOK … FROM a local
# directory. The copy is faithful (diff -r), the launcher lands, and DROP
# PLAYBOOK --yes removes the playbook and its launcher.
# Mid-sequence state is proven inside chained commands — gentar runs
# verify.files (post-steps only) before verify.commands.

[scenario]
name = "playbook-install-local"
subject = "claude-playbooks"
agent = "shell"

[oracle]
steps = [
  '''docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$WORKSPACE_DIR":/src -w /src golang:1.26 sh -c 'V=$(cat .gentar-version 2>/dev/null || git describe --tags --always --dirty 2>/dev/null || echo dev); GOCACHE=/tmp/gocache go build -ldflags "-X github.com/ramazanpolat/claude-playbooks/cmd.Version=$V" -o cpb .' ''',
  'mkdir -p "$HOME/.local/bin" && install -m 755 "$WORKSPACE_DIR/cpb" "$HOME/.local/bin/cpb"',
  '''FIX="$HOME/fixture-src"; mkdir -p "$FIX/skills/demo"; printf 'name = "fixture-pb"\n' > "$FIX/.playbook"; printf '# fixture playbook\n' > "$FIX/CLAUDE.md"; printf '# demo skill\n' > "$FIX/skills/demo/SKILL.md"''',
]

[[verify.files]]
# Post-steps state: the CLI is installed and the fixture is minted.
path = "~/fixture-src/.playbook"

[[verify.commands]]
# The statement names the target: fixture-src -> fixture-pb.
command = 'cpb CREATE PLAYBOOK fixture-pb FROM "$HOME/fixture-src" && test -f "$HOME/.claude-playbooks/fixture-pb/CLAUDE.md" && test -f "$HOME/.claude-playbooks/fixture-pb/skills/demo/SKILL.md" && echo installed'

[[verify.commands]]
command = 'test -x "$HOME/.local/bin/fixture-pb" && echo launcher-ok'
contains = "launcher-ok"

[[verify.commands]]
command = 'cpb SHOW PLAYBOOKS | grep -F fixture-pb'
contains = "fixture-pb"

[[verify.commands]]
# Faithful apart from settings.json, where CREATE writes the memory
# setting's one entry (memory = 'isolated', a new playbook's default).
command = '''diff -r -x settings.json "$HOME/fixture-src" "$HOME/.claude-playbooks/fixture-pb" >/dev/null && python3 -c 'import json,os,sys; v=json.load(open(sys.argv[1])); assert v == {"claudeMdExcludes": [os.path.expanduser("~/.claude") + "/**"]}, v' "$HOME/.claude-playbooks/fixture-pb/settings.json" && echo faithful'''
contains = "faithful"

[[verify.commands]]
# --yes: a headless DROP; the launcher named for the playbook goes with it.
command = 'cpb DROP PLAYBOOK fixture-pb --yes && test ! -e "$HOME/.claude-playbooks/fixture-pb" && test ! -e "$HOME/.local/bin/fixture-pb" && echo clean'
contains = "clean"
