# claude-playbooks own-arena suite 4: `install` from a LOCAL directory —
# the offline half of install (the git half needs a public source repo
# and api.github.com quota; cli-release-install covers the released path).
# A fixture playbook is minted in the oracle step with a .playbook
# manifest so name resolution takes the manifest branch, then install is
# verified by reality: files under ~/.claude-playbooks, launcher on PATH,
# list sees it, delete removes both.

[scenario]
name = "playbook-install-local"
subject = "claude-playbooks"
agent = "shell"

[oracle]
steps = [
  '''docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$WORKSPACE_DIR":/src -w /src golang:1.21 sh -c 'V=$(cat .gentar-version 2>/dev/null || git describe --tags --always --dirty 2>/dev/null || echo dev); GOCACHE=/tmp/gocache go build -ldflags "-X github.com/ramazanpolat/claude-playbooks/cmd.Version=$V" -o claude-playbook .' ''',
  'mkdir -p "$HOME/.local/bin" && install -m 755 "$WORKSPACE_DIR/claude-playbook" "$HOME/.local/bin/claude-playbook"',
  '''FIX="$HOME/fixture-src"; mkdir -p "$FIX/skills/demo"; printf 'name = "fixture-pb"\n' > "$FIX/.playbook"; printf '# fixture playbook\n' > "$FIX/CLAUDE.md"; printf '# demo skill\n' > "$FIX/skills/demo/SKILL.md"''',
]

[[verify.commands]]
command = 'claude-playbook install "$HOME/fixture-src"'

[[verify.files]]
path = "~/.claude-playbooks/fixture-pb/CLAUDE.md"

[[verify.files]]
path = "~/.claude-playbooks/fixture-pb/skills/demo/SKILL.md"

# Manifest-named launcher, on PATH.
[[verify.files]]
path = "~/.local/bin/fixture-pb"

[[verify.commands]]
command = "claude-playbook list"
contains = "fixture-pb"

[[verify.commands]]
command = 'diff "$HOME/fixture-src/CLAUDE.md" "$HOME/.claude-playbooks/fixture-pb/CLAUDE.md" && echo copied-faithfully'
contains = "copied-faithfully"

[[verify.commands]]
command = "claude-playbook delete fixture-pb"

[[verify.commands]]
command = 'test ! -e "$HOME/.claude-playbooks/fixture-pb" && test ! -e "$HOME/.local/bin/fixture-pb" && echo gone'
contains = "gone"
