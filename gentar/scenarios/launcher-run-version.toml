# claude-playbooks own-arena suite 5: `run` actually launches claude
# with the playbook wired — proven keylessly via `--version`, which
# claude answers without credentials. This is the only suite that
# exercises the product's core promise (CLAUDE_CONFIG_DIR → playbook,
# claude spawned inside it); everything else proves bookkeeping around
# it. The launcher alias runs the same path as `run`.

[scenario]
name = "launcher-run-version"
subject = "claude-playbooks"
agent = "shell"
# Spawns the real `claude` binary — needs the bench template with
# agent CLIs pre-installed (the base shell sandbox has none).
template = "gentar-bench-v1"

[oracle]
steps = [
  '''docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$WORKSPACE_DIR":/src -w /src golang:1.26 sh -c 'V=$(cat .gentar-version 2>/dev/null || git describe --tags --always --dirty 2>/dev/null || echo dev); GOCACHE=/tmp/gocache go build -ldflags "-X github.com/ramazanpolat/claude-playbooks/cmd.Version=$V" -o cpb .' ''',
  'mkdir -p "$HOME/.local/bin" && install -m 755 "$WORKSPACE_DIR/cpb" "$HOME/.local/bin/cpb"',
  'cpb CREATE PLAYBOOK run-version-pb',
]

[[verify.commands]]
# claude --version answers keyless; wrapping proves BOTH exit 0 and
# captured output in one check. Flags after the name are forwarded —
# that forwarding is under test as much as the spawn.
command = 'out=$(cpb run run-version-pb --version 2>&1) && printf "runok:%s" "$out"'
contains = "runok:"

[[verify.commands]]
# Same spawn through the launcher alias, not just the subcommand.
command = 'out=$("$HOME/.local/bin/run-version-pb" --version 2>&1) && printf "launchok:%s" "$out"'
contains = "launchok:"

[[verify.commands]]
# The memory setting, end to end through the real claude (v4.0.0-rc3): a
# marker in ~/.claude/CLAUDE.md reaches a launch of a playbook made with
# SETTINGS memory = 'shared' and never one made with the default
# ('isolated'). Both launch from a directory under $HOME, where Claude Code's
# ancestor walk meets ~/.claude. The requests go to a stub API on loopback
# that records them and answers 400: no real request, and the key is a dummy.
command = '''mkdir -p "$HOME/.claude" "$HOME/work" && printf 'MARKER-MACHINE-MEMORY-7Q\n' > "$HOME/.claude/CLAUDE.md" && cpb CREATE PLAYBOOK mem-iso NO LAUNCHER >/dev/null && cpb CREATE PLAYBOOK mem-shared NO LAUNCHER SETTINGS memory=shared >/dev/null || { echo setup-failed; exit 1; }
cat > "$HOME/stub.py" <<'EOF'
import http.server, os, sys
out = sys.argv[1]
class H(http.server.BaseHTTPRequestHandler):
    def do_POST(self):
        data = self.rfile.read(int(self.headers.get("content-length") or 0))
        with open(os.path.join(out, "req-%d" % len(os.listdir(out))), "wb") as f:
            f.write(data)
        body = b'{"type":"error","error":{"type":"invalid_request_error","message":"stub"}}'
        self.send_response(400)
        self.send_header("content-type", "application/json")
        self.send_header("content-length", str(len(body)))
        self.end_headers()
        self.wfile.write(body)
    def log_message(self, *a):
        pass
s = http.server.HTTPServer(("127.0.0.1", 0), H)
print(s.server_address[1], flush=True)
s.serve_forever()
EOF
mkdir -p "$HOME/req"
python3 -u "$HOME/stub.py" "$HOME/req" > "$HOME/stub.port" 2>&1 & pid=$!
trap 'kill $pid 2>/dev/null' EXIT
i=0; while ! grep -qE '^[0-9]+$' "$HOME/stub.port" && [ $i -lt 100 ]; do sleep 0.1; i=$((i+1)); done
port=$(head -1 "$HOME/stub.port")
for pb in mem-iso mem-shared; do
  rm -f "$HOME"/req/*
  (cd "$HOME/work" && ANTHROPIC_BASE_URL="http://127.0.0.1:$port" ANTHROPIC_API_KEY=sk-arena-dummy-not-a-key CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1 DISABLE_AUTOUPDATER=1 timeout 120 cpb run $pb -p hi < /dev/null > /dev/null 2>&1)
  ls "$HOME/req" | grep -q . || { echo "no-request-from-$pb"; exit 1; }
  if grep -rqF MARKER-MACHINE-MEMORY-7Q "$HOME/req"; then echo "$pb:loaded"; else echo "$pb:absent"; fi
done > "$HOME/mem.out"
grep -qx 'mem-iso:absent' "$HOME/mem.out" && grep -qx 'mem-shared:loaded' "$HOME/mem.out" && echo memory-setting-ok || cat "$HOME/mem.out"'''
contains = "memory-setting-ok"
