# claude-playbooks own-arena suite 3: full playbook lifecycle, each stage
# checked against the filesystem in the SAME command that performs it
# (gentar runs verify.files before verify.commands, and commands run in
# listed order — so mid-sequence state is provable only inside chained
# commands; files can only see the post-steps state).
#
# Product semantics under test (observed, not assumed):
#   - RENAME TO REMOVES the launcher the old name owned, and registers one
#     for the new name
#   - DROP PLAYBOOK REMOVES every launcher named for the playbook, its
#     manifest alias included, unless another playbook still claims the name
#   - DROP PLAYBOOK needs --yes headless: without it the confirmation is read
#     from stdin, gets EOF, and cancels. The interactive path is a pilot
#     suite's job (pilot-interactive-delete), not a shell oracle's.

[scenario]
name = "playbook-lifecycle"
subject = "claude-playbooks"
agent = "shell"

[oracle]
steps = [
  '''docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$WORKSPACE_DIR":/src -w /src golang:1.26 sh -c 'V=$(cat .gentar-version 2>/dev/null || git describe --tags --always --dirty 2>/dev/null || echo dev); GOCACHE=/tmp/gocache go build -ldflags "-X github.com/ramazanpolat/claude-playbooks/cmd.Version=$V" -o cpb .' ''',
  'mkdir -p "$HOME/.local/bin" && install -m 755 "$WORKSPACE_DIR/cpb" "$HOME/.local/bin/cpb"',
]

[[verify.files]]
# Post-steps state: the CLI is installed. Everything else is created by
# the command chain below.
path = "~/.local/bin/cpb"

[[verify.commands]]
command = 'cpb CREATE PLAYBOOK lifecycle-pb && test -f "$HOME/.claude-playbooks/lifecycle-pb/CLAUDE.md" && echo created'

[[verify.commands]]
command = 'cpb SHOW PLAYBOOKS | grep -F lifecycle-pb'
contains = "lifecycle-pb"

[[verify.commands]]
command = 'cpb SHOW PLAYBOOK lifecycle-pb'
contains = "lifecycle-pb"

[[verify.commands]]
command = 'cpb ALTER PLAYBOOK lifecycle-pb ALIAS lcpb && test -x "$HOME/.local/bin/lcpb" && echo aliased'

[[verify.commands]]
command = 'cpb ALTER PLAYBOOK lifecycle-pb NO ALIAS && test ! -e "$HOME/.local/bin/lcpb" && echo dealiased'

[[verify.commands]]
# Re-alias, so the DROP below has BOTH a name launcher and an alias
# launcher to retire -- the rule covers the manifest alias too.
command = 'cpb ALTER PLAYBOOK lifecycle-pb ALIAS lcpb && test -x "$HOME/.local/bin/lcpb" && echo re-aliased'

[[verify.commands]]
# The registry entry moves AND the launchers follow: the old name's
# launcher is retired, the new name gets one. A launcher named by the
# manifest alias is untouched by a rename -- the alias did not change.
command = 'cpb ALTER PLAYBOOK lifecycle-pb RENAME TO lifecycle-pb2 && test -d "$HOME/.claude-playbooks/lifecycle-pb2" && test ! -d "$HOME/.claude-playbooks/lifecycle-pb" && test ! -e "$HOME/.local/bin/lifecycle-pb" && test -x "$HOME/.local/bin/lifecycle-pb2" && test -x "$HOME/.local/bin/lcpb" && echo renamed'

[[verify.commands]]
command = 'cpb SHOW PLAYBOOKS | grep -F lifecycle-pb2'
contains = "lifecycle-pb2"

[[verify.commands]]
# --yes: headless runs cannot answer the confirmation prompt (without it
# DROP PLAYBOOK reads stdin, gets EOF, and cancels). Both launchers go with
# the playbook -- the one named for it and the one named by its alias.
command = 'cpb DROP PLAYBOOK lifecycle-pb2 --yes && test ! -e "$HOME/.claude-playbooks/lifecycle-pb2" && test ! -e "$HOME/.local/bin/lifecycle-pb2" && test ! -e "$HOME/.local/bin/lcpb" && echo deleted'

[[verify.commands]]
command = '! cpb SHOW PLAYBOOKS | grep -F lifecycle-pb2 && echo unlisted'
contains = "unlisted"
