# claude-playbooks own-arena suite 3: full playbook lifecycle, each stage
# checked against the filesystem in the SAME command that performs it
# (gentar runs verify.files before verify.commands, and commands run in
# listed order — so mid-sequence state is provable only inside chained
# commands; files can only see the post-steps state).
#
# Product semantics under test (observed, not assumed):
#   - rename KEEPS the old launcher (it may serve other registry roots)
#   - delete KEEPS the launcher too, and requires -y headless
# The launcher's continued existence is asserted, not fought.

[scenario]
name = "playbook-lifecycle"
subject = "claude-playbooks"
agent = "shell"

[oracle]
steps = [
  '''docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$WORKSPACE_DIR":/src -w /src golang:1.21 sh -c 'V=$(cat .gentar-version 2>/dev/null || git describe --tags --always --dirty 2>/dev/null || echo dev); GOCACHE=/tmp/gocache go build -ldflags "-X github.com/ramazanpolat/claude-playbooks/cmd.Version=$V" -o claude-playbook .' ''',
  'mkdir -p "$HOME/.local/bin" && install -m 755 "$WORKSPACE_DIR/claude-playbook" "$HOME/.local/bin/claude-playbook"',
]

[[verify.files]]
# Post-steps state: the CLI is installed. Everything else is created by
# the command chain below.
path = "~/.local/bin/claude-playbook"

[[verify.commands]]
command = 'claude-playbook create lifecycle-pb && test -f "$HOME/.claude-playbooks/lifecycle-pb/CLAUDE.md" && echo created'

[[verify.commands]]
command = 'claude-playbook list | grep -F lifecycle-pb'
contains = "lifecycle-pb"

[[verify.commands]]
command = 'claude-playbook info lifecycle-pb'
contains = "lifecycle-pb"

[[verify.commands]]
command = 'claude-playbook alias lifecycle-pb lcpb && test -x "$HOME/.local/bin/lcpb" && echo aliased'

[[verify.commands]]
command = 'claude-playbook dealias lifecycle-pb && test ! -e "$HOME/.local/bin/lcpb" && echo dealiased'

[[verify.commands]]
# The registry entry moves: new dir present, old dir gone. The old
# LAUNCHER stays by design — not asserted here, see the final check.
command = 'claude-playbook rename lifecycle-pb lifecycle-pb2 && test -d "$HOME/.claude-playbooks/lifecycle-pb2" && test ! -d "$HOME/.claude-playbooks/lifecycle-pb" && echo renamed'

[[verify.commands]]
command = 'claude-playbook list | grep -F lifecycle-pb2'
contains = "lifecycle-pb2"

[[verify.commands]]
# -y: headless runs cannot answer the confirmation prompt (a bare
# delete reads it from stdin, gets EOF, and silently cancels).
command = 'claude-playbook delete lifecycle-pb2 -y && test ! -e "$HOME/.claude-playbooks/lifecycle-pb2" && echo deleted'

[[verify.commands]]
command = '! claude-playbook list | grep -F lifecycle-pb2 && echo unlisted'
contains = "unlisted"
