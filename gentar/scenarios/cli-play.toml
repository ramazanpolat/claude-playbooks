# claude-playbooks own-arena suite: cpb play (v3.28.0), slice 1. A played
# recipe is fetched once, checked against what it may hold, and planned
# against a throwaway store: --check, --dry-run --json, --sha256, and the
# template-directory check the website's CI runs. Local recipes only; the
# https fetch limits are unit-tested here and join this scenario with the
# local TLS server in a later slice.

[scenario]
name = "cli-play"
subject = "claude-playbooks"
agent = "shell"

[oracle]
steps = [
  '''docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$WORKSPACE_DIR":/src -w /src golang:1.26 sh -c 'V=$(cat .gentar-version 2>/dev/null || git describe --tags --always --dirty 2>/dev/null || echo dev); GOCACHE=/tmp/gocache go build -ldflags "-X github.com/ramazanpolat/claude-playbooks/cmd.Version=$V" -o claude-playbook .' ''',
  'mkdir -p "$HOME/.local/bin" && install -m 755 "$WORKSPACE_DIR/claude-playbook" "$HOME/.local/bin/claude-playbook"',
  '''F="$HOME/playfx"; mkdir -p "$F/tpl" && printf '%s\n' "ALTER PLAYBOOK" "  USE ENV work" "  SET VAR GITHUB_TOKEN=abc AS PLAINTEXT;" "ALTER DEFAULTS SET SECRET HELPER 'x';" > "$F/bad.cpb" && printf '%s\n' "-- title: Router" "-- description: GLM through a router." "" "ALTER PLAYBOOK" "  SET VAR ANTHROPIC_BASE_URL=https://router.example.net/v1 SENTRY_URL=https://sentry.example.com/1" "  SET MODEL 'glm-5.3';" > "$F/router.cpb" && cp "$F/router.cpb" "$F/tpl/router.cpb" && printf '%s\n' "-- title: Reviewer" "-- description: Reads code." "-- min-cpb: 3.28.0" "" "ALTER PLAYBOOK SET MODEL 'opus';" > "$F/tpl/code-reviewer.cpb" && printf '%s\n' code-reviewer router > "$F/tpl/index.txt"''',
  'claude-playbook CREATE ENV mine SET ANTHROPIC_BASE_URL=https://mine.example && claude-playbook ALTER DEFAULTS USE ENV mine',
  '''F="$HOME/playfx"; printf '%s\n' "-- title: Plain" "-- description: A model." "" "ALTER PLAYBOOK SET MODEL 'claude-opus-5-5';" > "$F/plain.cpb" && mkdir -p "$HOME/sleepclaude" && printf '%s\n' '#!/bin/sh' 'echo "$CLAUDE_CONFIG_DIR" > "$HOME/play-cfg"' 'sleep 30' > "$HOME/sleepclaude/claude" && chmod 755 "$HOME/sleepclaude/claude"''',
]

[[verify.commands]]
# --check: what a played recipe may not hold is refused, with its line,
# and exits 1; a recipe that moves the model endpoint asks for exactly one
# typed confirmation (root, 2026-10-01: SENTRY_URL is flagged, not typed).
command = '''F="$HOME/playfx"; if claude-playbook play --check "$F/bad.cpb" > "$HOME/bad.out" 2>&1; then echo bad-accepted; elif ! grep -q "line 2   USE ENV: it would attach your env sets" "$HOME/bad.out" || ! grep -q "line 3   SET VAR GITHUB_TOKEN: a shared recipe carries no secret, even AS PLAINTEXT" "$HOME/bad.out" || ! grep -q "line 4   ALTER DEFAULTS" "$HOME/bad.out"; then echo bad-wrong; else claude-playbook play --check "$F/router.cpb" > "$HOME/r.out" 2>&1 && [ "$(grep -c "you will type" "$HOME/r.out")" = 1 ] && grep -q "you will type: router.example.net" "$HOME/r.out" && grep -q "a tool may send data to sentry.example.com" "$HOME/r.out" && echo play-check-ok; fi'''
contains = "play-check-ok"

[[verify.commands]]
# --dry-run --json: APPLY's plan with a "play" block, against a throwaway
# store: the user's DEFAULTS (env set mine) never layer in, the endpoint
# move isolates the login, nothing is left in the user's store or in /tmp.
command = '''F="$HOME/playfx"; before=$(ls -d /tmp/cpb-play-* 2>/dev/null | wc -l); claude-playbook play --dry-run --json "$F/router.cpb" > "$HOME/r.json" 2> "$HOME/r.err" && python3 -c "import json,sys; r=json.load(open(sys.argv[1])); p=r['play']; assert r['ok'] and p['endpoint']=='router.example.net' and p['playbook'].startswith('play-router-') and len(r['statements'])==3 and p['header']['title']=='Router' and len(p['sha256'])==64, r" "$HOME/r.json" && ! grep -q "mine.example" "$HOME/r.json" "$HOME/r.err" && ! claude-playbook SHOW PLAYBOOKS --json | grep -q "play-router-" && [ "$(ls -d /tmp/cpb-play-* 2>/dev/null | wc -l)" = "$before" ] && echo play-dry-run-ok'''
contains = "play-dry-run-ok"

[[verify.commands]]
# --sha256: any other recipe is refused before anything is shown.
command = '''F="$HOME/playfx"; if claude-playbook play --check --sha256 00 "$F/router.cpb" > "$HOME/s.out" 2>&1; then echo sha-accepted; elif grep -q "refused before anything was shown or written" "$HOME/s.out" && ! grep -q "Recipe:" "$HOME/s.out"; then echo play-sha-ok; else echo sha-wrong; fi'''
contains = "play-sha-ok"

[[verify.commands]]
# --check on a template directory, as the website's CI runs it: every
# template, a title and description, and index.txt listing them sorted.
command = '''F="$HOME/playfx/tpl"; claude-playbook play --check "$F" > "$HOME/d.out" 2>&1 && grep -q "ok   index.txt (2 template(s))" "$HOME/d.out" && printf '%s\n' router code-reviewer > "$F/index.txt" && if claude-playbook play --check "$F" > "$HOME/d2.out" 2>&1; then echo unsorted-accepted; else grep -q "FAIL index.txt" "$HOME/d2.out" && echo play-dir-ok; fi'''
contains = "play-dir-ok"

[[verify.commands]]
# Slice 2: a played recipe runs in a throwaway playbook that is removed on
# every way out. A stub claude records its config dir and sleeps; then ^C
# (SIGINT to the process group), a closed terminal (SIGHUP to the group) and
# `kill <cpb>` (SIGTERM to cpb alone, which passes it on) each end the
# session, and after each the store is gone and cpb has exited. It starts
# through python with INT and HUP at their defaults, in its own session: a
# shell's `cmd &` would start it with SIGINT ignored, unlike a terminal.
command = '''F="$HOME/playfx"; ok=0; for sig in INT HUP TERM; do rm -f "$HOME/play-cfg"; PATH="$HOME/sleepclaude:$PATH" python3 -c 'import os,signal,sys; [signal.signal(x, signal.SIG_DFL) for x in (signal.SIGINT, signal.SIGHUP)]; os.setsid(); os.execvp(sys.argv[1], sys.argv[1:])' claude-playbook play --yes "$F/plain.cpb" > "$HOME/play-$sig.out" 2>&1 & pid=$!; i=0; while [ ! -s "$HOME/play-cfg" ] && [ $i -lt 100 ]; do sleep 0.1; i=$((i+1)); done; cfg=$(cat "$HOME/play-cfg" 2>/dev/null); [ -n "$cfg" ] && [ -d "$cfg" ] || { echo "$sig-no-session"; break; }; if [ $sig = TERM ]; then kill -TERM $pid; else python3 -c 'import os,signal,sys; os.killpg(int(sys.argv[1]), getattr(signal, "SIG"+sys.argv[2]))' $pid $sig; fi; i=0; while kill -0 $pid 2>/dev/null && [ $i -lt 100 ]; do sleep 0.1; i=$((i+1)); done; if kill -0 $pid 2>/dev/null; then echo "$sig-cpb-still-running"; break; fi; if [ -e "$cfg" ]; then echo "$sig-left-$cfg"; break; fi; store=${cfg%/store/*}; if [ -e "$store" ]; then echo "$sig-left-store"; break; fi; ok=$((ok+1)); done; [ $ok = 3 ] && echo play-cleanup-ok'''
contains = "play-cleanup-ok"

[[verify.commands]]
# A SIGTERM aimed at cpb goes to its session only, never to a process
# group: started from a script (not a group leader), `kill <cpb>` must end
# the session and leave the script alive (a group-wide forward would have
# killed the caller too), and the store is gone.
command = '''F="$HOME/playfx"; rm -f "$HOME/play-cfg" "$HOME/caller-alive"; PATH="$HOME/sleepclaude:$PATH" sh -c 'claude-playbook play --yes "$1" > "$HOME/play-caller.out" 2>&1 & echo $! > "$HOME/cpb-pid"; wait; sleep 1; echo yes > "$HOME/caller-alive"' sh "$F/plain.cpb" & caller=$!; i=0; while [ ! -s "$HOME/play-cfg" ] && [ $i -lt 100 ]; do sleep 0.1; i=$((i+1)); done; cfg=$(cat "$HOME/play-cfg" 2>/dev/null); kill -TERM "$(cat "$HOME/cpb-pid")"; wait $caller; if [ "$(cat "$HOME/caller-alive" 2>/dev/null)" != yes ]; then echo caller-killed; elif [ -n "$cfg" ] && [ -e "$cfg" ]; then echo store-left; else echo play-term-caller-ok; fi'''
contains = "play-term-caller-ok"
