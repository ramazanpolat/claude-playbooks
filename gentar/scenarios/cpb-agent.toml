# claude-playbooks own-arena suite: cpb agent, the assistant. A stub
# `claude` on PATH records what it received (argv, environment, working
# directory, stdin) and answers a canned plan chosen by the request, so the
# whole path runs keylessly on the real binary: what reaches the model
# (names only, never a value, whatever the shell exports), how claude is
# called (no user settings, no tools, from a directory outside home), what
# is only shown, what asks first, what is refused, and the exit codes.

[scenario]
name = "cpb-agent"
subject = "claude-playbooks"
agent = "shell"

[oracle]
steps = [
  '''docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$WORKSPACE_DIR":/src -w /src golang:1.26 sh -c 'V=$(cat .gentar-version 2>/dev/null || git describe --tags --always --dirty 2>/dev/null || echo dev); GOCACHE=/tmp/gocache go build -ldflags "-X github.com/ramazanpolat/claude-playbooks/cmd.Version=$V" -o cpb .' ''',
  'mkdir -p "$HOME/.local/bin" && install -m 755 "$WORKSPACE_DIR/cpb" "$HOME/.local/bin/cpb"',
  '''cat > "$HOME/.local/bin/claude" <<'STUB'
#!/bin/sh
[ "$1" = "--version" ] && { echo "2.1.310 (Claude Code)"; exit 0; }
printf '%s\n' "$@" > "$HOME/agent-argv"
env > "$HOME/agent-env"
pwd > "$HOME/agent-pwd"
cat > "$HOME/agent-stdin"
case "$(tail -n 2 "$HOME/agent-stdin")" in
  *drop*) P='{"answer":"","steps":[{"args":["DROP","ENV","route-b"],"why":"Removes env set route-b."}],"notes":[]}' ;;
  *throwaway*) P='{"answer":"","steps":[{"args":["start","--env-set","route-a","--delete","/tmp/cpb-agent-scratch"],"why":"A throwaway session on route-a."}],"notes":[]}' ;;
  *passwd*) P='{"answer":"","steps":[{"args":["cat","/etc/passwd"],"why":"Reads a file."}],"notes":[]}' ;;
  *) P='{"answer":"Your env sets.","steps":[{"args":["SHOW","ENVS"],"why":"Lists the env sets (v3 called them env profiles)."}],"notes":[]}' ;;
esac
printf '{"type":"result","subtype":"success","is_error":false,"result":"","structured_output":%s}\n' "$P"
STUB
chmod 755 "$HOME/.local/bin/claude"''',
  'cpb CREATE ENV route-a SET ANTHROPIC_BASE_URL=http://127.0.0.1:9/v1 DESCRIPTION "arena-description-canary"',
  'cpb ALTER ENV route-a SET ANTHROPIC_AUTH_TOKEN=arena-envset-canary-7Qz AS PLAINTEXT',
  'cpb CREATE ENV route-b SET MAX_THINKING_TOKENS=8000',
  'cpb CREATE PLAYBOOK work && cpb ALTER PLAYBOOK work USE ENV route-a SET VAR MY_SECRET=arena-manifest-canary-4Kp AS PLAINTEXT',
]

[[verify.files]]
path = "~/.claude-playbooks/.env-sets/route-a.toml"

[[verify.commands]]
# Names reach claude, values never: not an env set's, not the manifest's,
# not one the shell exports as a route variable or as an unrelated one.
# claude runs with no user settings and no tools, from a fresh directory
# outside home, and gets no route variable.
command = '''export ANTHROPIC_BASE_URL=http://127.0.0.1:9/arena-url-canary ANTHROPIC_AUTH_TOKEN=arena-shell-canary FOO_TOKEN=arena-unrelated-canary; out=$(cpb agent "list the env profiles") || { echo "agent failed"; exit 1; }; for f in agent-argv agent-env agent-stdin; do if grep -q canary "$HOME/$f"; then echo "leaked into $f"; exit 1; fi; done; grep -q '"name":"route-a"' "$HOME/agent-stdin" && grep -q '"route":"away"' "$HOME/agent-stdin" && grep -q '"name":"work"' "$HOME/agent-stdin" || { echo "names missing"; exit 1; }; grep -qx -- "--setting-sources" "$HOME/agent-argv" && grep -qx project "$HOME/agent-argv" && grep -qx -- "--strict-mcp-config" "$HOME/agent-argv" && grep -qx -- "--tools" "$HOME/agent-argv" || { echo "flags missing"; exit 1; }; if grep -q -e '^ANTHROPIC_BASE_URL=' -e '^CLAUDE_CONFIG_DIR=' "$HOME/agent-env"; then echo "route variable passed"; exit 1; fi; case "$(cat "$HOME/agent-pwd")" in "$HOME"*) echo "ran under home"; exit 1;; esac; echo "$out" | grep -qF "cpb SHOW ENVS" && echo agent-names-only-ok'''
contains = "agent-names-only-ok"

[[verify.commands]]
# Without --run a plan is only shown: the env set is still there.
command = 'out=$(cpb agent "drop route-b") && echo "$out" | grep -qF "cpb DROP ENV route-b" && echo "$out" | grep -qF "! removes env set route-b" && test -e "$HOME/.claude-playbooks/.env-sets/route-b.toml" && echo agent-show-only-ok'
contains = "agent-show-only-ok"

[[verify.commands]]
# --run without a terminal: refused (exit 1) without --yes, and a step that
# always asks first is refused even with it; nothing runs. A plan with
# nothing to ask runs under --yes.
command = 'cpb agent --run "list" </dev/null >/dev/null 2>&1; a=$?; cpb agent --run --yes "drop route-b" </dev/null >/dev/null 2>&1; b=$?; test "$a" = 1 && test "$b" = 1 && test -e "$HOME/.claude-playbooks/.env-sets/route-b.toml" && cpb agent --run --yes "list" </dev/null | grep -q "^route-b" && echo agent-run-rules-ok'
contains = "agent-run-rules-ok"

[[verify.commands]]
# A step that is not cpb is never proposed as runnable, and --run refuses
# the plan.
command = 'cpb agent "show me passwd" | grep -q "not proposed" && { cpb agent --run --yes "show me passwd" </dev/null >/dev/null 2>&1; test $? = 1; } && echo agent-reject-ok'
contains = "agent-reject-ok"

[[verify.commands]]
# A launch that routes away from Anthropic is shown from outside home,
# with what it deletes and the login note.
command = 'out=$(cpb agent "a throwaway session on route-a") && echo "$out" | grep -qF "(cd /tmp && cpb start --env-set route-a --delete /tmp/cpb-agent-scratch)" && echo "$out" | grep -qF "! deletes /tmp/cpb-agent-scratch" && echo "$out" | grep -qF "/login" && echo agent-route-away-ok'
contains = "agent-route-away-ok"

[[verify.commands]]
# Usage errors exit 2; plain words in quotes point at cpb agent.
command = 'cpb agent >/dev/null 2>&1; a=$?; cpb agent --yes "list" >/dev/null 2>&1; b=$?; test "$a" = 2 && test "$b" = 2 && cpb "print every env profile" 2>&1 | grep -qF "cpb agent" && echo agent-usage-ok'
contains = "agent-usage-ok"
