# claude-playbooks own-arena suite 9: native playbook update -- the path a
# pilot takes to move an installed playbook onto a newer source.
#
# Nothing else in the suite covered `update` at all, which is the most
# destructive non-delete operation the CLI has: it replaces top-level
# entries in a live config directory. What must SURVIVE that is the point
# of this suite, because a regression there is silent until a pilot loses
# their settings.
#
# A local directory is the source, so no network and no git host.
# CREATE PLAYBOOK … FROM records [source] only for GIT sources, so the
# manifest is written by hand -- exactly what converting a local install to
# an updatable one takes.
#
# The new source declares a migrate step ([update] migrate): --dry-run shows
# it, a run without --yes off a terminal is refused and changes nothing, and
# with --yes it runs after the registry lock is released -- the script runs
# a writing cpb statement, which would wait forever on a held lock.
#
# Quoting: TOML LITERAL strings ('...' / '''...''') throughout. A basic
# string ("...") processes backslash escapes before the shell sees them,
# which mangles any command carrying \n or \". Files are written with
# `printf '%s\n' line line ...`: POSIX printf does not reinterpret escapes
# or % inside a %s ARGUMENT, so a line may hold quotes and % freely.

[scenario]
name = "playbook-update"
subject = "claude-playbooks"
agent = "shell"

[oracle]
steps = [
  '''docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$WORKSPACE_DIR":/src -w /src golang:1.26 sh -c 'V=$(cat .gentar-version 2>/dev/null || git describe --tags --always --dirty 2>/dev/null || echo dev); GOCACHE=/tmp/gocache go build -ldflags "-X github.com/ramazanpolat/claude-playbooks/cmd.Version=$V" -o cpb .' ''',
  'mkdir -p "$HOME/.local/bin" && install -m 755 "$WORKSPACE_DIR/cpb" "$HOME/.local/bin/cpb"',
  'mkdir -p "$HOME/src/migrations"',
  '''printf '%s\n' '# upstream v1' > "$HOME/src/CLAUDE.md"''',
  '''printf '%s\n' 'name = "pb"' 'version = "1.0.0"' > "$HOME/src/.playbook"''',
  # Single-quoted lines, so $1/$2/$3 land in the FILE instead of expanding here.
  '''printf '%s\n' '#!/bin/sh' 'echo "$1 -> $2" > "$3/migrated"' 'cpb ALTER PLAYBOOK pb SET VAR MIGRATED=yes' > "$HOME/src/migrations/apply.sh"''',
  'chmod 755 "$HOME/src/migrations/apply.sh"',
]

[[verify.files]]
path = "~/.local/bin/cpb"

[[verify.commands]]
# Create it, then make it updatable: a local source records no [source].
command = '''cpb CREATE PLAYBOOK pb FROM "$HOME/src" NO LAUNCHER && printf '%s\n' 'name = "pb"' 'version = "1.0.0"' '' '[source]' "repository = \"$HOME/src\"" > "$HOME/.claude-playbooks/pb/.playbook" && echo installed'''

[[verify.commands]]
# A local file the source knows nothing about, and one it DOES ship. Both
# must survive the overlay.
command = '''printf '%s\n' '{"pilot":true}' > "$HOME/.claude-playbooks/pb/settings.json" && printf '%s\n' mine > "$HOME/.claude-playbooks/pb/.claude.json" && echo seeded'''

[[verify.commands]]
command = '''printf '%s\n' '# upstream v2' > "$HOME/src/CLAUDE.md" && printf '%s\n' 'name = "pb"' 'version = "2.0.0"' '' '[update]' 'migrate = "migrations/apply.sh"' > "$HOME/src/.playbook" && echo bumped'''

[[verify.commands]]
# --dry-run reports the move...
command = 'cpb update pb --dry-run'
contains = "available: 2.0.0"

[[verify.commands]]
# ...and the declared step, with its sha256...
command = 'cpb update pb --dry-run'
contains = "migrate:   migrations/apply.sh (sha256 "

[[verify.commands]]
# ...and installs nothing.
command = 'grep -F "upstream v1" "$HOME/.claude-playbooks/pb/CLAUDE.md" && test ! -e "$HOME/.claude-playbooks/pb/migrated" && echo dry-run-installed-nothing'
contains = "dry-run-installed-nothing"

[[verify.commands]]
# Off a terminal the step needs --yes: without it the update is refused
# and nothing changes.
command = '''out=$(cpb update pb 2>&1 </dev/null); printf '%s' "$out" | grep -qF "pass --yes" && grep -F "upstream v1" "$HOME/.claude-playbooks/pb/CLAUDE.md" >/dev/null && echo consent-required'''
contains = "consent-required"

[[verify.commands]]
command = 'cpb update pb --yes && grep -F "upstream v2" "$HOME/.claude-playbooks/pb/CLAUDE.md" && echo updated'
contains = "updated"

[[verify.commands]]
command = 'grep -F pilot "$HOME/.claude-playbooks/pb/settings.json" && echo settings-preserved'
contains = "settings-preserved"

[[verify.commands]]
command = 'grep -F mine "$HOME/.claude-playbooks/pb/.claude.json" && echo state-preserved'
contains = "state-preserved"

[[verify.commands]]
# The migrate step ran, and was handed the version pair.
command = 'grep -F "1.0.0 -> 2.0.0" "$HOME/.claude-playbooks/pb/migrated" && echo migration-ran'
contains = "migration-ran"

[[verify.commands]]
# It ran outside the registry lock: its own writing statement went through.
command = '''grep -F 'MIGRATED = "yes"' "$HOME/.claude-playbooks/pb/.playbook" && echo ran-outside-the-lock'''
contains = "ran-outside-the-lock"

[[verify.commands]]
# Replaced entries are backed up beside the install, not destroyed.
command = 'ls -d "$HOME/.claude-playbooks/".pb.bak.* >/dev/null 2>&1 && echo backed-up'
contains = "backed-up"

[[verify.commands]]
command = 'cpb SHOW PLAYBOOK pb'
contains = "2.0.0"

[[verify.commands]]
# A playbook with no [source] cannot update natively, and says so rather than
# failing obscurely.
command = '''mkdir -p "$HOME/.claude-playbooks/orphan" && printf '%s\n' '# orphan' > "$HOME/.claude-playbooks/orphan/CLAUDE.md" && cpb update orphan 2>&1 || true'''
contains = "nothing to update from"

[[verify.commands]]
# And backups do not accumulate: still the one from the single update.
command = 'test "$(ls -d "$HOME/.claude-playbooks/".pb.bak.* | wc -l)" -eq 1 && echo no-churn'
contains = "no-churn"
