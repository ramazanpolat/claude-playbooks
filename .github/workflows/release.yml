name: Release

on:
  push:
    tags:
      - 'v*'

# Four jobs. arena-gate refuses a commit with no green full regression.
# Then a Darwin artifact is executed on macOS BEFORE anything is
# published: build (ubuntu) produces every binary, smoke-darwin (macOS,
# arm64) runs the darwin-arm64 asset and checks it reports the tag, and
# release publishes only when both succeeded. CI covers the source; this is
# the only place the downloadable binaries themselves are exercised.
jobs:
  # FIRST: may this commit be released at all? gentar/release-gate.sh passes
  # only when the arena workflow has a SUCCESSFUL `arena / phase2` job on
  # exactly this commit -- the full regression, however it was triggered (a
  # dispatch, the `arena` tag, a `v*-rc*` tag). build needs this job, and
  # smoke-darwin and release need build, so nothing ships without it. It
  # names its reason when it refuses, including a phase 2 that GitHub
  # cancelled before it started. The flow: push `arena` (or tag v*-rc*) on
  # the commit, wait for phase 2 to go green, then tag v* on that commit.
  arena-gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read     # to find the arena workflow's jobs for this sha
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: a green arena / phase2 on this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gentar/release-gate.sh "$GITHUB_SHA"

  build:
    needs: arena-gate
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.release_gate.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag is on main
        id: release_gate
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${{ github.ref_name }} points to $GITHUB_SHA, which is not on origin/main. Skipping release."
          fi

      # package.json's version is what `npx github:ramazanpolat/claude-playbooks`
      # runs (bin/npx-shim.sh reads npm_package_version), so a release whose
      # package.json still names the previous version ships the NEW binaries
      # while npx keeps serving the OLD one. ci.yml checks this too, but only
      # on a push to main -- after the tag has already published. v3.15.0 went
      # out that way: npx served v3.14.0, without the credential masking, until
      # the next main push turned CI red. Refuse the release here instead.
      - name: package.json version matches the tag
        if: steps.release_gate.outputs.release == 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          pkg=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' package.json | head -1)
          if [ "v$pkg" != "$TAG" ]; then
            echo "::error::package.json version ($pkg) != release tag ($TAG). Bump package.json in the commit the tag points to, then re-tag."
            exit 1
          fi
          echo "package.json version ($pkg) matches $TAG"

      # Build with the same current Go the macOS CI leg uses. go.mod keeps
      # the 1.21 language floor (the ubuntu CI leg proves it); the release
      # artifacts should not be the one build path CI never exercises.
      - uses: actions/setup-go@v5
        if: steps.release_gate.outputs.release == 'true'
        with:
          go-version: '1.26'

      - name: Test and vet
        if: steps.release_gate.outputs.release == 'true'
        run: |
          go test ./...
          go vet ./...

      - name: Build binaries
        if: steps.release_gate.outputs.release == 'true'
        run: |
          mkdir dist
          GOOS=darwin  GOARCH=arm64 go build -ldflags "-X github.com/ramazanpolat/claude-playbooks/cmd.Version=${{ github.ref_name }}" -o dist/claude-playbook-darwin-arm64  .
          GOOS=darwin  GOARCH=amd64 go build -ldflags "-X github.com/ramazanpolat/claude-playbooks/cmd.Version=${{ github.ref_name }}" -o dist/claude-playbook-darwin-amd64  .
          GOOS=linux   GOARCH=amd64 go build -ldflags "-X github.com/ramazanpolat/claude-playbooks/cmd.Version=${{ github.ref_name }}" -o dist/claude-playbook-linux-amd64   .
          GOOS=linux   GOARCH=arm64 go build -ldflags "-X github.com/ramazanpolat/claude-playbooks/cmd.Version=${{ github.ref_name }}" -o dist/claude-playbook-linux-arm64   .

      - name: Generate checksums
        if: steps.release_gate.outputs.release == 'true'
        run: |
          cd dist
          sha256sum claude-playbook-* > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        if: steps.release_gate.outputs.release == 'true'
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  smoke-darwin:
    needs: build
    if: needs.build.outputs.release == 'true'
    # macos-latest is Apple silicon at the time of writing; the step below
    # picks the matching asset either way, so a label change cannot break
    # the gate.
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Execute the Darwin asset for this runner's architecture
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # macos-latest has moved between Intel and Apple silicon over the
          # years; pick the asset that matches the host instead of assuming.
          case "$(uname -m)" in
            arm64)  bin=dist/claude-playbook-darwin-arm64 ;;
            x86_64) bin=dist/claude-playbook-darwin-amd64 ;;
            *) echo "unexpected runner architecture: $(uname -m)"; exit 1 ;;
          esac
          echo "runner: $(uname -m), asset: $bin"
          chmod +x "$bin"
          out="$("$bin" --version)"
          echo "$out"
          case "$out" in *"$TAG"*) ;; *) echo "binary does not report the tag"; exit 1;; esac
          # A registry command against an empty scratch root, not just --version.
          "$bin" --playbooks-dir "$RUNNER_TEMP/pb" list

  release:
    needs: [build, smoke-darwin]
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
