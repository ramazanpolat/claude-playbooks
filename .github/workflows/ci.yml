name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both legs run the documented Go floor (go.mod: go 1.26.0), the
          # version the arena builds with (golang:1.26).
          - os: ubuntu-latest
            go-version: '1.26'
          - os: macos-latest
            go-version: '1.26'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # version-drift check reads the latest tag

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      # The arena builds with golang:1.26, so go.mod's go directive must not
      # rise above 1.26 (a `go get` of a newer dependency raises it
      # silently), and no toolchain line may ask for a newer Go.
      - name: go directive stays at 1.26
        run: |
          grep -Eqx 'go 1\.26(\.[0-9]+)?' go.mod || { echo "go.mod's go directive is not 1.26.x:"; grep -n '^go ' go.mod; exit 1; }
          if grep -q '^toolchain ' go.mod; then echo "go.mod has a toolchain line:"; grep -n '^toolchain ' go.mod; exit 1; fi

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "unformatted files:" && echo "$out" && exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Shell syntax
        run: |
          sh -n install.sh
          sh -n uninstall.sh
          sh -n bin/npx-shim.sh

      # package.json "version" must equal the latest release tag: the npx
      # shim uses it to pick the release it fetches, so a stale value makes
      # `npx github:ramazanpolat/claude-playbooks` serve an old binary.
      # Run only on main — a PR can legitimately be ahead of the tag.
      #
      # --match 'v*' is load-bearing: this repo also carries non-release
      # tags that trigger the arena workflow ('arena', 'arena-*'), and a
      # bare `git describe` returns the nearest tag of ANY kind. Once such
      # a tag sits closer to HEAD than the last release, an unmatched
      # describe compares package.json against a trigger tag's name and
      # every push to main fails.
      - name: npx package version matches latest tag
        if: github.event_name == 'push'
        run: |
          latest=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -z "$latest" ]; then
            echo "no tags yet; skipping"
            exit 0
          fi
          pkg=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' package.json | head -1)
          if [ "v$pkg" != "$latest" ]; then
            echo "package.json version ($pkg) != latest tag ($latest)." \
              && echo "Bump package.json in the same commit as the release tag." \
              && exit 1
          fi
          echo "package.json version ($pkg) matches latest tag ($latest)"

  # Every example in examples/ is applied as its README says, on a real
  # build, in a throwaway HOME: dry run, apply, apply again with no change.
  # `claude` and the secret helper are stand-ins (examples/.ci); example 06
  # clones its playbook from GitHub.
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Build
        run: go build -o "$RUNNER_TEMP/cpb" .
      - name: Apply the examples
        run: examples/check.sh "$RUNNER_TEMP/cpb"
      - name: Every clause has a reference entry and an example
        run: examples/coverage.sh

  # The upgrade from the previous release: that release's binary applies
  # its own examples, then this build takes over the same state and must
  # read it identically (examples/upgrade.sh says what is compared). The
  # previous release is the newest release tag reachable from HEAD^, so a
  # release commit is checked against the one before it.
  upgrade:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go-version: '1.26'
          # Old releases (go 1.21 directives) build with 1.26 too.
          - os: macos-latest
            go-version: '1.26'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Build this commit and the previous release
        run: |
          set -eu
          # HEAD^ is main's previous commit on a release or main push, and
          # the base branch's tip on a pull request's merge ref: its newest
          # release tag is the previous release, whatever HEAD carries.
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^)
          echo "previous release: $prev"
          echo "PREV=$prev" >> "$GITHUB_ENV"
          git worktree add -q "$RUNNER_TEMP/prev" "$prev"
          (cd "$RUNNER_TEMP/prev" && go build -o "$RUNNER_TEMP/cpb-prev" .)
          go build -o "$RUNNER_TEMP/cpb" .
      - name: Upgrade from the previous release
        run: examples/upgrade.sh "$RUNNER_TEMP/cpb-prev" "$RUNNER_TEMP/cpb" "$RUNNER_TEMP/prev/examples"

  # SELECT beyond the built-in form runs through a real clickhouse-local:
  # the rows cpb pipes in and the query it rewrites are checked end to end.
  select-clickhouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Build
        run: go build -o "$RUNNER_TEMP/cpb" .
      - name: Install clickhouse-local
        run: |
          cd "$RUNNER_TEMP" && curl -fsSL https://clickhouse.com/ | sh
          "$RUNNER_TEMP/clickhouse" local --version
      - name: Query
        run: |
          set -eu
          export HOME="$(mktemp -d)" CPB_CLICKHOUSE="$RUNNER_TEMP/clickhouse"
          cpb="$RUNNER_TEMP/cpb"
          # want <expected> <query>: runs the query, joins its lines with spaces.
          want() {
            got="$("$cpb" "$2" | tr '\n' ' ' | sed 's/ $//')"
            if [ "$got" != "$1" ]; then echo "FAIL: $2"; echo "  want: $1"; echo "  got:  $got"; exit 1; fi
            echo "ok: $2"
          }
          "$cpb" CREATE PLAYBOOK alpha NO ALIAS
          "$cpb" CREATE PLAYBOOK beta NO ALIAS
          "$cpb" ALTER PLAYBOOK beta SET VAR MODEL=glm X_TOKEN=sk-live-0123456789 AS PLAINTEXT >/dev/null
          "$cpb" "SELECT name, version FROM PLAYBOOKS"
          want 2 "SELECT count() FROM PLAYBOOKS FORMAT TSV"
          want "MODEL X_TOKEN" "SELECT key FROM VARS WHERE playbook = 'beta' AND effective ORDER BY key FORMAT TSV"
          want 1 "SELECT countIf(redacted) FROM VARS FORMAT TSV"
          # alpha has no manifest version: an empty version_tuple.
          want beta "SELECT name FROM PLAYBOOKS WHERE version_tuple >= [0, 1] ORDER BY name FORMAT TSV"
          # SELECT *: version_tuple where it has always been on this path, the
          # columns added since (pilot_profile, v3.26.0) after it.
          tail2="$("$cpb" "SELECT * FROM PLAYBOOKS LIMIT 1 FORMAT TSVWithNames" | head -1 | awk -F '\t' '{print $(NF-1), $NF}')"
          [ "$tail2" = "version_tuple pilot_profile" ] || { echo "FAIL: SELECT * column tail is '$tail2', want 'version_tuple pilot_profile'"; exit 1; }
          echo "ok: SELECT * column tail"
