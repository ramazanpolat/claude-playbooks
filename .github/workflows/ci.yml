name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu keeps the documented Go floor (go.mod: go 1.21).
          - os: ubuntu-latest
            go-version: '1.21'
          # macOS needs a current Go: 1.21's linker emits binaries without
          # LC_UUID, which macOS 26's dyld refuses to load — the suite
          # execs a freshly built binary and dies with "missing LC_UUID
          # load command" / abort trap.
          - os: macos-latest
            go-version: '1.26'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # version-drift check reads the latest tag

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "unformatted files:" && echo "$out" && exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Shell syntax
        run: |
          sh -n install.sh
          sh -n uninstall.sh
          sh -n bin/npx-shim.sh
          sh -n .github/scripts/release-refs.sh

      # Which tag commits may be released, and what the npx check says as
      # tags appear, on a throwaway repository (both OSes: BSD tools too).
      - name: Release refs
        run: sh .github/scripts/release-refs_test.sh

      # package.json "version" is what the npx shim fetches, so on main it
      # must name the newest RELEASE: the highest vX.Y.Z tag by version, rc
      # tags and the arena's trigger tags ('arena', 'arena-*') excluded. Not
      # `git describe` from HEAD: a release tagged on a release branch
      # (v3.24.0 on release/v3.24) is not an ancestor of main, and describe
      # would keep main's npx on the previous release forever. Ahead of the
      # newest release with no such tag yet passes with a warning: the bump
      # commit of a release about to be tagged. Main only (CI's push trigger
      # is main): a release branch stays on its own minor once a newer one is
      # released, which this check would call stale.
      - name: npx package version matches the newest release
        if: github.event_name == 'push'
        run: |
          pkg=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' package.json | head -1)
          .github/scripts/release-refs.sh npx-check "$pkg"

  # Every example in examples/ is applied as its README says, on a real
  # build, in a throwaway HOME: dry run, apply, apply again with no change.
  # `claude` and the secret helper are stand-ins (examples/.ci); example 06
  # clones its playbook from GitHub.
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Build
        run: go build -o "$RUNNER_TEMP/cpb" .
      - name: Apply the examples
        run: examples/check.sh "$RUNNER_TEMP/cpb"
      - name: Every clause has a reference entry and an example
        run: examples/coverage.sh

  # The upgrade from the previous release: that release's binary applies
  # its own examples, then this build takes over the same state and must
  # read it identically (examples/upgrade.sh says what is compared). The
  # previous release is the newest release tag reachable from HEAD^, so a
  # release commit is checked against the one before it.
  upgrade:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go-version: '1.21'
          # macOS needs a current Go for the same LC_UUID reason as the
          # test job above; old releases build with it too.
          - os: macos-latest
            go-version: '1.26'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Build this commit and the previous release
        run: |
          set -eu
          # HEAD^ is main's previous commit on a release or main push, and
          # the base branch's tip on a pull request's merge ref: its newest
          # release tag is the previous release, whatever HEAD carries.
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^)
          echo "previous release: $prev"
          echo "PREV=$prev" >> "$GITHUB_ENV"
          git worktree add -q "$RUNNER_TEMP/prev" "$prev"
          (cd "$RUNNER_TEMP/prev" && go build -o "$RUNNER_TEMP/cpb-prev" .)
          go build -o "$RUNNER_TEMP/cpb" .
      - name: Upgrade from the previous release
        run: examples/upgrade.sh "$RUNNER_TEMP/cpb-prev" "$RUNNER_TEMP/cpb" "$RUNNER_TEMP/prev/examples"

  # SELECT beyond the built-in form runs through a real clickhouse-local:
  # the rows cpb pipes in and the query it rewrites are checked end to end.
  select-clickhouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Build
        run: go build -o "$RUNNER_TEMP/cpb" .
      - name: Install clickhouse-local
        run: |
          cd "$RUNNER_TEMP" && curl -fsSL https://clickhouse.com/ | sh
          "$RUNNER_TEMP/clickhouse" local --version
      - name: Query
        run: |
          set -eu
          export HOME="$(mktemp -d)" CPB_CLICKHOUSE="$RUNNER_TEMP/clickhouse"
          cpb="$RUNNER_TEMP/cpb"
          # want <expected> <query>: runs the query, joins its lines with spaces.
          want() {
            got="$("$cpb" "$2" | tr '\n' ' ' | sed 's/ $//')"
            if [ "$got" != "$1" ]; then echo "FAIL: $2"; echo "  want: $1"; echo "  got:  $got"; exit 1; fi
            echo "ok: $2"
          }
          "$cpb" CREATE PLAYBOOK alpha NO ALIAS
          "$cpb" CREATE PLAYBOOK beta NO ALIAS
          "$cpb" ALTER PLAYBOOK beta SET VAR MODEL=glm X_TOKEN=sk-live-0123456789 AS PLAINTEXT >/dev/null
          "$cpb" "SELECT name, version FROM PLAYBOOKS"
          want 2 "SELECT count() FROM PLAYBOOKS FORMAT TSV"
          want "MODEL X_TOKEN" "SELECT key FROM VARS WHERE playbook = 'beta' AND effective ORDER BY key FORMAT TSV"
          want 1 "SELECT countIf(redacted) FROM VARS FORMAT TSV"
          # alpha has no manifest version: an empty version_tuple.
          want beta "SELECT name FROM PLAYBOOKS WHERE version_tuple >= [0, 1] ORDER BY name FORMAT TSV"
