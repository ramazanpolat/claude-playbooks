name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu keeps the documented Go floor (go.mod: go 1.21).
          - os: ubuntu-latest
            go-version: '1.21'
          # macOS needs a current Go: 1.21's linker emits binaries without
          # LC_UUID, which macOS 26's dyld refuses to load — the suite
          # execs a freshly built binary and dies with "missing LC_UUID
          # load command" / abort trap.
          - os: macos-latest
            go-version: '1.26'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # version-drift check reads the latest tag

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "unformatted files:" && echo "$out" && exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Shell syntax
        run: |
          sh -n install.sh
          sh -n uninstall.sh
          sh -n bin/npx-shim.sh

      # package.json "version" must equal the latest release tag: the npx
      # shim uses it to pick the release it fetches, so a stale value makes
      # `npx github:ramazanpolat/claude-playbooks` serve an old binary.
      # Run only on main — a PR can legitimately be ahead of the tag.
      #
      # --match 'v*' is load-bearing: this repo also carries non-release
      # tags that trigger the arena workflow ('arena', 'arena-*'), and a
      # bare `git describe` returns the nearest tag of ANY kind. Once such
      # a tag sits closer to HEAD than the last release, an unmatched
      # describe compares package.json against a trigger tag's name and
      # every push to main fails.
      - name: npx package version matches latest tag
        if: github.event_name == 'push'
        run: |
          latest=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -z "$latest" ]; then
            echo "no tags yet; skipping"
            exit 0
          fi
          pkg=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' package.json | head -1)
          if [ "v$pkg" != "$latest" ]; then
            echo "package.json version ($pkg) != latest tag ($latest)." \
              && echo "Bump package.json in the same commit as the release tag." \
              && exit 1
          fi
          echo "package.json version ($pkg) matches latest tag ($latest)"

  # Every example in examples/ is applied as its README says, on a real
  # build, in a throwaway HOME: dry run, apply, apply again with no change.
  # `claude` and the secret helper are stand-ins (examples/.ci); example 06
  # clones its playbook from GitHub.
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Build
        run: go build -o "$RUNNER_TEMP/cpb" .
      - name: Apply the examples
        run: examples/check.sh "$RUNNER_TEMP/cpb"

  # SELECT beyond the built-in form runs through a real clickhouse-local:
  # the rows cpb pipes in and the query it rewrites are checked end to end.
  select-clickhouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Build
        run: go build -o "$RUNNER_TEMP/cpb" .
      - name: Install clickhouse-local
        run: |
          cd "$RUNNER_TEMP" && curl -fsSL https://clickhouse.com/ | sh
          "$RUNNER_TEMP/clickhouse" local --version
      - name: Query
        run: |
          set -eu
          export HOME="$(mktemp -d)" CPB_CLICKHOUSE="$RUNNER_TEMP/clickhouse"
          cpb="$RUNNER_TEMP/cpb"
          "$cpb" CREATE PLAYBOOK alpha NO ALIAS >/dev/null
          "$cpb" CREATE PLAYBOOK beta NO ALIAS >/dev/null
          "$cpb" ALTER PLAYBOOK beta SET VAR MODEL=glm X_TOKEN=sk-live-0123456789 AS PLAINTEXT >/dev/null
          test "$("$cpb" "SELECT count() FROM PLAYBOOKS FORMAT TSV")" = 2
          test "$("$cpb" "SELECT key FROM VARS WHERE playbook = 'beta' AND effective ORDER BY key FORMAT TSV" | tr '\n' ' ')" = "MODEL X_TOKEN "
          test "$("$cpb" "SELECT countIf(redacted) FROM VARS FORMAT TSV")" = 1
          # alpha has no manifest, so no version: an empty version_tuple.
          test "$("$cpb" "SELECT name FROM PLAYBOOKS WHERE version_tuple >= [0, 1] ORDER BY name FORMAT TSV" | tr '\n' ' ')" = "beta "
          "$cpb" "SELECT name, version FROM PLAYBOOKS"
