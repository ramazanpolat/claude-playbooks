# claude-playbooks own arena. Runs this repo's gentar suites on every
# push to main, every v* tag, and on demand. Conditions live HERE —
# edit the `on:` block; the arena doesn't care.
#
# Runner: self-hosted with label `arena` (Docker + network reach to the
# bench-host). One-time setup is documented in gentar/README.md.
#
# Trust note: the arena engine (agent-realm/gentar) runs with reach to
# the bench SSH key. The default ref is gentar's main; if that matters
# to you, dispatch with gentar_ref pinned to an audited SHA.
name: arena

# The bench-host is a single VM, and gentar's own CI gate runs on the same
# runner with its own `concurrency` group -- which serializes ITS jobs, not
# ours. Without this, two of our own arena runs (a push landing during a
# dispatch, say) spawn sandboxes on that bench concurrently and race on
# names. Not cancel-in-progress: an arena run that is already touching the
# bench should finish and clean up rather than be killed mid-sandbox.
concurrency:
  group: arena-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main]
    tags: ['v*', 'arena', 'arena-*']   # v* = release proof · arena-* = keyword tags
  workflow_dispatch:
    inputs:
      scenario:
        description: scenario to run (empty = all suites)
        default: ''
      gentar_ref:
        description: gentar ref to run the arena from
        default: main

# Keyword tags — run the arena on ANY commit by pushing a tag at it:
#   arena                    → every suite in gentar/scenarios/
#   arena-<scenario>         → that one suite (e.g. arena-playbook-lifecycle)
# The tag names the SUBJECT commit (this checkout); GENTAR_REF still
# picks the engine. Tag a branch tip, a main commit, or a dirty
# experiment — same path. Delete the tag to re-run.
# v* tags run the full suite too (release proof), unchanged.

jobs:
  arena:
    runs-on: [self-hosted, arena]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags: cli-head-build floats the version via git describe

      # Dispatch inputs go through env, never into shell source — a
      # quoted value can't become a command. The bench key lands in
      # RUNNER_TEMP, which the runner wipes after the job; nothing
      # secret persists in the workspace.
      - name: stage bench access
        run: |
          printf '%s\n' "$BENCH_KEY" > "$RUNNER_TEMP/bench_key"
          chmod 600 "$RUNNER_TEMP/bench_key"
          printf '%s\n' "$CLONE_KEY" > "$RUNNER_TEMP/gentar_clone_key"
          chmod 600 "$RUNNER_TEMP/gentar_clone_key"
        env:
          BENCH_KEY: ${{ secrets.BENCH_SSH_KEY }}
          # Read-only deploy key on agent-realm/gentar — the arena
          # engine repo is private; the runner needs it to clone.
          CLONE_KEY: ${{ secrets.GENTAR_CLONE_KEY }}

      - name: run suites
        run: |
          # Keyword tag → scenario: `arena` runs everything, `arena-<name>`
          # runs one. Dispatch input wins when both are set (explicit ask).
          INPUT="$SCENARIO_INPUT"
          if [ -z "$INPUT" ] && [ "$GITHUB_EVENT_NAME" = push ] \
             && [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            tag=${GITHUB_REF#refs/tags/}
            case "$tag" in
              arena)    INPUT='' ;;
              arena-*)  INPUT=${tag#arena-} ;;
            esac
          fi
          if [ -n "$INPUT" ]; then
            for s in $INPUT; do
              [ -f "gentar/scenarios/$s.toml" ] \
                || { echo "unknown scenario: $s" >&2; exit 2; }
            done
            exec gentar/run.sh $INPUT
          fi
          # "Run everything" means every suite this run CAN run. A suite
          # that declares `credentials` is refused by the coordinator
          # (exit 2, before any bench exists) when none of the named
          # variables is set -- correct for a direct ask, wrong for a push
          # that never promised an agent credential. Such suites are left
          # out of the sweep unless a credential is present, and named
          # either way so the log says which and why. Dispatching one by
          # name still reaches the honest refusal.
          suites=""
          for f in gentar/scenarios/*.toml; do
            s=$(basename "$f" .toml)
            if grep -q '^credentials = \[' "$f"; then
              if [ -n "$ANTHROPIC_API_KEY" ] || [ -n "$ANTHROPIC_AUTH_TOKEN" ]; then
                echo "including $s (agent credential present)"
              else
                echo "skipping $s (needs an agent credential; none set)"
                continue
              fi
            fi
            suites="$suites $s"
          done
          exec gentar/run.sh $suites
        env:
          SCENARIO_INPUT: ${{ github.event.inputs.scenario }}
          GENTAR_REF: ${{ github.event.inputs.gentar_ref || 'main' }}
          GENTAR_BENCH_KEY_FILE: ${{ runner.temp }}/bench_key
          GENTAR_CLONE_SSH_KEY: ${{ runner.temp }}/gentar_clone_key
          # This runner also hosts gentar's own CI gate, whose compose stack
          # publishes the same host ports. Every shared binding is moved
          # aside here; gentar's docker-compose.yml documents each override
          # and reads them as ${VAR:-default}.
          #   ClickHouse debug binding: gentar's gate owns 8123.
          GENTAR_CLICKHOUSE_HOST_PORT: "8126"
          #   OTLP receiver: the collector publishes 4318 on ALL interfaces
          #   (benches reach it from the bench-host), so two stacks on one
          #   Docker host collide outright. gentar's gate pins 4319.
          GENTAR_OTLP_HOST_PORT: "4320"
          # Agent-in-the-loop suites. Providers are alternatives: a
          # first-party key, or any Anthropic-compatible endpoint via
          # token + base URL. All unset is the normal case and simply
          # leaves those suites out of the sweep (see above).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
          # Model pins: SLOT vars, not ANTHROPIC_MODEL (claude-code rejects
          # unknown main-model IDs). ALL FOUR, because claude-code picks a
          # slot for itself -- an unpinned one sends a literal Anthropic ID
          # to an endpoint that never heard of it. A routed endpoint needs
          # every slot it could be asked for; unset is fine for a
          # first-party key, which knows all of them.
          #
          # This is the FIRST link in the chain: repo var -> here -> run.sh
          # forwards into the coordinator container -> gentar exports into
          # the bench. Adding a pin anywhere downstream without adding it
          # here does nothing at all.
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ vars.ANTHROPIC_DEFAULT_SONNET_MODEL }}
          ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ vars.ANTHROPIC_DEFAULT_OPUS_MODEL }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ vars.ANTHROPIC_DEFAULT_HAIKU_MODEL }}
          ANTHROPIC_DEFAULT_FABLE_MODEL: ${{ vars.ANTHROPIC_DEFAULT_FABLE_MODEL }}
          # Ceiling the budget guard enforces; must be >= each agent
          # suite's declared [budget] tokens.
          GENTAR_BUDGET_CAP: "50000"

      - name: upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arena-reports
          path: gentar/reports/
          if-no-files-found: error

      - name: teardown
        # Free the port and volumes for anything else on this host —
        # the fix-loop artifact is already uploaded above.
        if: always()
        run: docker compose -p arena-claude-playbooks down -v --remove-orphans || true
