name: Site snippets

# Keeps the site (site/index.html, site/tour.html) from drifting from the
# grammar: builds this commit's cpb, re-runs every command the tour shows and
# applies the home page's showcase recipe in a throwaway HOME, checks each
# card's claims against what cpb says, and diffs the `cpb tui` blocks against
# the real test goldens. It also plans and applies a large set of the
# customizer's option combinations with this build. See
# site-tools/verify-snippets.sh. The template files in site/p/ are checked by
# templates-verify.yml.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "site-tools/**"
      - "README.md"
      - "docs/**"
      - "examples/**"
      - "cmd/**"
      - "internal/**"
      - "go.mod"
  pull_request:
    paths:
      - "site/**"
      - "site-tools/**"
      - "README.md"
      - "docs/**"
      - "examples/**"
      - "cmd/**"
      - "internal/**"
      - "go.mod"

jobs:
  verify-snippets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build
        run: go build -o "$RUNNER_TEMP/cpb" .

      - name: Install clickhouse-local
        run: |
          cd "$RUNNER_TEMP" && curl -fsSL https://clickhouse.com/ | sh
          "$RUNNER_TEMP/clickhouse" local --version

      - name: Verify the site's snippets against this build
        env:
          CPB_CLICKHOUSE: ${{ runner.temp }}/clickhouse
        run: site-tools/verify-snippets.sh "$RUNNER_TEMP/cpb"
