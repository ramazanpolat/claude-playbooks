# Nightly phase 2: the full arena regression, judged suites included.
#
# Lives outside the kit on purpose: gentar-arena.yml is a kit file that
# `gentar/run.sh --check` compares byte for byte with the pinned engine's
# copy, and gentar v0.8.0's kit has no schedule trigger. This workflow only
# dispatches that workflow on a branch; with no scenario, the dispatch is
# phase 2.
#
# Which branch: NIGHTLY_REF below. A scheduled run always starts from the
# default branch's copy of this file, so the target is set here, not in the
# repository's settings. During a stable candidate's nights it names the
# release branch (release/v3.24 until v3.24.0 is tagged); after the tag it
# goes back to "" (the default branch). A manual dispatch can override it.
name: arena-nightly

on:
  schedule:
    - cron: "17 2 * * *"   # 02:17 UTC, daily
  workflow_dispatch:
    inputs:
      ref:
        description: "branch to run phase 2 on (empty: NIGHTLY_REF, else the default branch)"
        required: false
        default: ""

permissions:
  actions: write           # to dispatch gentar-arena.yml

env:
  NIGHTLY_REF: release/v3.24   # "" after v3.24.0 is tagged

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: dispatch phase 2
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.ref }}
          # On a schedule, github.ref_name is the default branch.
          DEFAULT_REF: ${{ github.event.repository.default_branch || github.ref_name }}
        run: |
          REF="${INPUT_REF:-${NIGHTLY_REF:-$DEFAULT_REF}}"
          echo "phase 2 on $REF"
          gh workflow run gentar-arena.yml --repo "$GITHUB_REPOSITORY" --ref "$REF"
