# Nightly phase 2: the full arena regression, judged suites included.
#
# Lives outside the kit on purpose: gentar-arena.yml is a kit file that
# `gentar/run.sh --check` compares byte for byte with the pinned engine's
# copy, and gentar v0.8.0's kit has no schedule trigger. This workflow only
# dispatches that workflow on the default branch; with no scenario, the
# dispatch is phase 2.
name: arena-nightly

on:
  schedule:
    - cron: "17 2 * * *"   # 02:17 UTC, daily
  workflow_dispatch:

permissions:
  actions: write           # to dispatch gentar-arena.yml

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: dispatch phase 2 on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.event.repository.default_branch }}
        run: gh workflow run gentar-arena.yml --repo "$GITHUB_REPOSITORY" --ref "$REF"
