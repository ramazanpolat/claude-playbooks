# Nightly phase 2: the full arena regression, judged suites included.
#
# Lives outside the kit on purpose: gentar-arena.yml is a kit file that
# `gentar/run.sh --check` compares byte for byte with the pinned engine's
# copy, and gentar v0.8.0's kit has no schedule trigger. This workflow only
# dispatches that workflow on a branch; with no scenario, the dispatch is
# phase 2.
#
# Nightlies are drift monitors, not release gates (the pilot's rule of
# 2026-09-29: a release needs a green full phase 2 on its exact tag commit).
# Every night this runs phase 2 on the default branch AND on the latest
# published release, so drift in the bench image, the agent CLI or a
# provider shows on both. A red on main is fixed like any bug; a red on the
# release becomes a patch. A manual dispatch with `ref` runs that ref only.
name: arena-nightly

on:
  schedule:
    - cron: "17 2 * * *"   # 02:17 UTC, daily
  workflow_dispatch:
    inputs:
      ref:
        description: "the one ref to run phase 2 on (empty: the default branch and the latest release)"
        required: false
        default: ""

permissions:
  actions: write           # to dispatch gentar-arena.yml
  contents: read           # to read the latest release

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: dispatch phase 2
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.ref }}
          # On a schedule, github.ref_name is the default branch.
          DEFAULT_REF: ${{ github.event.repository.default_branch || github.ref_name }}
        run: |
          if [ -n "$INPUT_REF" ]; then
            refs=$INPUT_REF
          else
            # The latest published, non-prerelease release (GitHub's own
            # notion); none yet means the default branch only.
            latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
            refs="$DEFAULT_REF${latest:+ $latest}"
          fi
          for ref in $refs; do
            echo "phase 2 on $ref"
            gh workflow run gentar-arena.yml --repo "$GITHUB_REPOSITORY" --ref "$ref"
          done
