# Nightly phase 2: the full arena regression, judged suites included.
#
# Lives outside the kit on purpose: gentar-arena.yml is a kit file that
# `gentar/run.sh --check` compares byte for byte with the pinned engine's
# copy, and gentar v0.8.0's kit has no schedule trigger. This workflow only
# dispatches that workflow on a branch; with no scenario, the dispatch is
# phase 2.
#
# Nightlies are drift monitors, not release gates (the pilot's rule of
# 2026-09-29: a release needs a green full phase 2 on its exact tag commit).
# Every night this runs phase 2 on the default branch, so drift in the bench
# image, the agent CLI or a provider shows. Not on a release tag: the kit's
# plan never gives a `v*` tag the bench (a release is gated by
# release-gate.sh instead), so a tag dispatch is skipped and would read as
# green; that happened to v3.25.0 on 2026-09-30. A red on main is fixed like
# any bug. A manual dispatch with `ref` runs that ref instead.
#
# Each dispatched run is then checked: if its `arena / phase2` job is
# skipped or absent, this job fails and names the ref and plan's reason
# (.github/scripts/arena-nightly.sh), so a skip never reads as green.
name: arena-nightly

on:
  schedule:
    - cron: "17 2 * * *"   # 02:17 UTC, daily
  workflow_dispatch:
    inputs:
      ref:
        description: "the one ref to run phase 2 on (empty: the default branch)"
        required: false
        default: ""

permissions:
  actions: write           # to dispatch gentar-arena.yml
  contents: read           # to check out

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: dispatch phase 2, and check each run really runs it
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.ref }}
          # On a schedule, github.ref_name is the default branch.
          DEFAULT_REF: ${{ github.event.repository.default_branch || github.ref_name }}
        run: |
          refs=${INPUT_REF:-$DEFAULT_REF}
          # Each ref's newest gentar-arena run before its dispatch: run ids
          # only grow, so the run this dispatch creates is the first
          # workflow_dispatch run above it. Not a time window, which could
          # pick an older dispatch or miss the new one on a skewed clock.
          last=""
          for ref in $refs; do
            before=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow gentar-arena.yml --branch "$ref" -L 1 --json databaseId --jq '.[0].databaseId // 0')
            last="$last $ref=$before"
            echo "phase 2 on $ref"
            gh workflow run gentar-arena.yml --repo "$GITHUB_REPOSITORY" --ref "$ref"
          done
          failed=0
          for ref in $refs; do
            before=$(printf '%s\n' $last | sed -n "s|^$ref=||p")
            id=""
            for i in $(seq 1 30); do
              id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow gentar-arena.yml --branch "$ref" --event workflow_dispatch -L 20 \
                --json databaseId --jq "[.[] | select(.databaseId > $before)] | sort_by(.databaseId) | .[0].databaseId // empty")
              if [ -n "$id" ]; then
                break
              fi
              sleep 10
            done
            if [ -z "$id" ]; then
              echo "::error::no phase 2 run appeared for $ref after its dispatch"
              failed=1
              continue
            fi
            echo "phase 2 on $ref: run $id"
            GH_REPO=$GITHUB_REPOSITORY sh .github/scripts/arena-nightly.sh check "$id" "$ref" || failed=1
          done
          exit $failed
