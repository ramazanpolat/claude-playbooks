name: Site templates

# site/p/ holds the template recipes `cpb play <name>` resolves (at the release
# tag of the cpb that runs it). Builds this commit's cpb and checks them with
# it: `cpb play --check site/p`, then every file planned, applied to a new
# playbook in a throwaway HOME and applied again (a no-op). Runs on changes to
# the templates and to the play code. See site-tools/check-template-files.py.

on:
  push:
    branches: [main]
    paths:
      - "site/p/**"
      - "site-tools/check-template-files.py"
      - "site-tools/sitelib.py"
      - "site-tools/stand-in-secret-helper"
      - "examples/.ci/**"
      - "cmd/play*.go"
      - "internal/play/**"
      - ".github/workflows/templates-verify.yml"
  pull_request:
    paths:
      - "site/p/**"
      - "site-tools/check-template-files.py"
      - "site-tools/sitelib.py"
      - "site-tools/stand-in-secret-helper"
      - "examples/.ci/**"
      - "cmd/play*.go"
      - "internal/play/**"
      - ".github/workflows/templates-verify.yml"

jobs:
  check-templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build
        run: go build -o "$RUNNER_TEMP/cpb" .

      - name: Check the templates against this build
        run: python3 site-tools/check-template-files.py --cpb "$RUNNER_TEMP/cpb"
