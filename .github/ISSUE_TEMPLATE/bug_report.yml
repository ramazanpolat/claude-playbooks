name: Bug report
description: Something behaved wrong
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `claude-playbook --version`
      placeholder: v3.1.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and architecture
      placeholder: macOS 15 arm64 / Ubuntu 24.04 amd64 (WSL?)
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: Install method
      options:
        - curl | sh (install.sh)
        - built from source
        - other
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Exact commands and output
      description: The command sequence that shows the problem, with full output.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
